# The Microsoft Visual C++ runtime DLL bundled beside ubc-vpn-service.exe
# and ubc-vpn.exe. Taken unmodified from the Visual Studio install on the
# build machine (the Distributable List allows VC\redist); see
# .claude/rules/dependencies.md and packaging/windows/licenses/.
#
# packaging/windows/vcruntime.sh copies it and stops if anything here
# differs from what the build machine has. When GitHub's runner image
# updates Visual Studio, that stop shows the new version and checksum;
# review them and change them here.

# The edition whose licence terms ship (licenses/microsoft-visual-studio-2026-license.txt):
# Visual Studio Enterprise 2026, 18.10.3 on GitHub's windows-2025-vs2026 image.
VC_PRODUCT=Microsoft.VisualStudio.Product.Enterprise
VC_PRODUCT_LINE_VERSION=18
# The compiler that builds the programs, as in VC\Auxiliary\Build\
# Microsoft.VCToolsVersion.default.txt. A program built by a newer compiler
# than the runtime beside it may need what that runtime lacks, so the build
# also stops if the compiler is newer than VC_REDIST_VERSION. The runner
# keeps several redistributable folders, so without this an image with a
# newer compiler would still find the pinned runtime.
VC_TOOLS_VERSION=14.51.36231
# The redistributable's version folder, VC\Redist\MSVC\<version>.
VC_REDIST_VERSION=14.51.36231
VC_CRT_FOLDER=Microsoft.VC145.CRT

# SHA-256 and name of each file, as in VC\Redist\MSVC\<version>\x64\<folder>.
d1f4225df2cd877dbf130d5668a021dce3f94118455ff5ec952061c30afc9ce7  vcruntime140.dll
