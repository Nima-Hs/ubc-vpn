# How the app is packaged on Linux: everything in electron-builder.yml, which
# this extends, and Linux's own settings below. `pnpm package:linux` builds
# the .deb and the .rpm into dist/. The rules it follows are in docs/architecture.md,
# "What the installers must do".

extends: electron-builder.yml

linux:
  # The app's program in /opt/UBC VPN, and the name of electron-builder's
  # /usr/bin link to it. Not `ubc-vpn`: that command is the command-line
  # client's (decision G19), linked below.
  executableName: ubc-vpn-app
  synopsis: UBC VPN app and command-line client
  description: >-
    A desktop app and command-line client for the UBC VPN.
    Not made by or affiliated with the University of British Columbia.
  category: Network
  # No e-mail address: the package's issues page is where to write.
  maintainer: UBC VPN <https://github.com/Nima-Hs/ubc-vpn/issues>
  vendor: Nima Hashemi
  # What packaging/linux/stage.sh gathers: the service and the command-line
  # client with libopenconnect.so.5, the file itself, in one folder
  # (resources/bin), their licence texts, and the policy the service
  # installs. Copied as they are; check-package and the installer workflow
  # compare them with the stage byte for byte.
  extraResources:
    - from: stage/bin
      to: bin
    - from: stage/licenses
      to: licenses
    - from: stage/policy.json
      to: policy.json
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]

deb:
  packageName: ubc-vpn
  artifactName: ubc-vpn_${version}_${arch}.${ext}
  # Our scripts, which hold electron-builder's own in full and add the
  # service's install and removal (packaging/linux). electron-builder has no
  # script before removal, so fpm is given ours directly.
  afterInstall: ../packaging/linux/after-install.sh
  afterRemove: ../packaging/linux/after-remove.sh
  fpm:
    - --before-remove
    - ../packaging/linux/before-remove.sh
    # /usr/bin/ubc-vpn, a link to the client (stage/links).
    - stage/links/ubc-vpn=/usr/bin/ubc-vpn
  # Setting these replaces electron-builder's own list, so the first line
  # is that list for Electron, as electron-builder 26.18.0 has it. The rest
  # is ours:
  # - libgbm1 and libasound2, which the Electron program links and neither
  #   that list nor libgtk-3-0 brings. Ubuntu 24.04 renamed libasound2 to
  #   libasound2t64.
  # - systemd-resolved, for split DNS. Debian 12 and Ubuntu 24.04 have it as
  #   a package of its own; on Ubuntu 22.04 it is part of systemd 249, and
  #   systemd moved it out in 251.3-2.
  # - libdbus-1-3, which the client's keyring loads.
  # - What libopenconnect.so.5 links (native/linux/README.md). Ubuntu 24.04
  #   renamed libgnutls30 to libgnutls30t64, which also provides the old name.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2 | libasound2t64
    - systemd-resolved | systemd (<< 251.3-2~)
    - libdbus-1-3
    - libgnutls30 (>= 3.7.3) | libgnutls30t64
    - zlib1g
    - libc6 (>= 2.34)

# The same package for Fedora, with the same scripts and files. An .rpm's
# scripts get the number of versions installed instead of a word; the
# scripts handle both.
rpm:
  packageName: ubc-vpn
  artifactName: ubc-vpn-${version}.${arch}.${ext}
  afterInstall: ../packaging/linux/after-install.sh
  afterRemove: ../packaging/linux/after-remove.sh
  fpm:
    - --before-remove
    - ../packaging/linux/before-remove.sh
    # Without the links rpmbuild adds under /usr/lib/.build-id: every
    # Electron app would own the same ones, so two such packages could not
    # be installed together.
    - --rpm-rpmbuild-define
    - _build_id_links none
    # Options go before this path: fpm reads everything after it as paths.
    - stage/links/ubc-vpn=/usr/bin/ubc-vpn
  # As for the .deb: electron-builder's own list for Electron first, then
  # systemd-resolved (a package of its own on Fedora), dbus-libs (libdbus-1,
  # for the client's keyring), and what libopenconnect.so.5 links. Fedora's
  # zlib is provided by zlib-ng-compat.
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - systemd-resolved
    - dbus-libs
    - gnutls >= 3.7.3
    - zlib
    - glibc >= 2.34
