# How the app is packaged on macOS: everything in electron-builder.yml, which
# this extends, and macOS's own settings below. `pnpm package:mac` builds the
# .pkg into dist/. The rules it follows are in docs/architecture.md, "What the
# installers must do".

extends: electron-builder.yml

mac:
  # No signing at all (decision G21): an ad-hoc identity would sign every
  # bundled library again, and so change it.
  identity: null
  # The oldest macOS supported, the libraries' own minimum.
  minimumSystemVersion: "13.0"
  category: public.app-category.utilities
  # What packaging/macos/stage.sh gathers for the app: the command-line client
  # and the libraries it loads, which run as the user, and their licence texts.
  # The service is not here (see pkg.scripts). Electron's own licence texts are
  # beside its app in node_modules, so nothing copies them by itself.
  extraResources:
    - from: stage/bin
      to: bin
    - from: stage/licenses
      to: licenses
    - from: node_modules/electron/dist/LICENSE
      to: licenses/electron/LICENSE.electron.txt
    - from: node_modules/electron/dist/LICENSES.chromium.html
      to: licenses/electron/LICENSES.chromium.html
  target:
    - target: pkg
      arch: [arm64]

pkg:
  # From the build folder: the script, and the service and policy it copies,
  # which macOS unpacks where only root can change them. The app is in
  # /Applications, which the admin group can write to, so they do not come from
  # there.
  scripts: ../stage/pkg-scripts
  installLocation: /Applications
  # Always there: never into a copy of the app the user moved somewhere else.
  isRelocatable: false
  # An update of the same or an older version replaces the app too.
  isVersionChecked: false
  overwriteAction: upgrade
  # For the whole machine, on the startup disk, and nowhere else.
  allowAnywhere: false
  allowCurrentUserHome: false
  allowRootDirectory: true
  artifactName: ubc-vpn-${version}-${arch}.${ext}
