default_install_hook_types: [pre-commit, commit-msg]

# Generated files must stay byte-for-byte what the generator writes.
exclude: ^app/src/shared/protocol/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # Microsoft's licence texts ship exactly as extracted, spaces included.
        exclude: ^packaging/windows/licenses/
      - id: end-of-file-fixer
        exclude: ^packaging/windows/licenses/
      - id: check-yaml
        # pnpm writes its lockfile as more than one YAML document.
        exclude: ^app/pnpm-lock\.yaml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8 # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, refactor, perf, test, build, ci, chore, revert]
