version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # react-dom refuses to run with any react version but its own, so bumping
      # one without the other breaks the app. Their types move with them.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # Node's types must match the Node the app runs on (app/.node-version),
      # so only patch and minor updates within that major are offered.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
