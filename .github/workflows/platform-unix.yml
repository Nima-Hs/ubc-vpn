name: Platform (Unix)

# The Unix socket channel is the boundary between ordinary programs and the
# root-level service. Some of its rules can only be tested by root with a
# second user to play the stranger, which a developer machine does not offer
# by default. GitHub's Linux and macOS runners have passwordless sudo, so
# those tests run here, and this workflow fails if any of them was skipped.
# The systemd unit the service is installed as is tried there too, under
# systemd on a Linux runner.

on:
  pull_request:
    paths:
      - crates/platform/**
      - crates/test-lines/**
      - crates/core/**
      # The programs this workflow builds and looks into on macOS.
      - crates/service/**
      - crates/cli/**
      - crates/engine/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/platform-unix.yml
      - .github/ran/check.sh
      - .github/ran/platform-unix/**
      # The systemd unit and its test.
      - packaging/linux/**
      - native/linux/test-packages.sh
      - .github/ran/systemd/**
      # The launchd job and its test.
      - packaging/macos/**
      - .github/ran/launchd/**
      # Last, so it wins: a change to Markdown files alone starts nothing.
      # None is built, tested or shipped. Any other file still counts.
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - crates/platform/**
      - crates/test-lines/**
      - crates/core/**
      # The programs this workflow builds and looks into on macOS.
      - crates/service/**
      - crates/cli/**
      - crates/engine/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/platform-unix.yml
      - .github/ran/check.sh
      - .github/ran/platform-unix/**
      # The systemd unit and its test.
      - packaging/linux/**
      - native/linux/test-packages.sh
      - .github/ran/systemd/**
      # The launchd job and its test.
      - packaging/macos/**
      - .github/ran/launchd/**
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-unix-${{ github.ref }}
  cancel-in-progress: true

# Named outright, because only then does a failing test at the head of a
# pipe fail the step.
defaults:
  run:
    shell: bash

jobs:
  channel:
    name: channel (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A stalled download would otherwise hold the job until its own limit.
      - name: Install the pinned Rust toolchain
        id: toolchain
        timeout-minutes: 4
        continue-on-error: true
        run: rustup toolchain install
      - name: Install the pinned Rust toolchain, second try
        if: steps.toolchain.outcome != 'success'
        timeout-minutes: 4
        run: rustup toolchain install
      # Restores the build of our dependencies, not of our own crates, which
      # are always built again. After the toolchain: its version is part of
      # the key, as are the OS, the job and the lockfile.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: platform-unix-${{ matrix.profile }}
          # Pull requests restore main's caches but save none of their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dev-mode code is free of warnings
        if: matrix.profile == 'debug'
        run: cargo clippy --locked -p ubc-vpn-platform --features dev-mode --all-targets -- -D warnings
      # Without the test-only features there must be no way to send a program
      # a request to stop. The crate's documentation has an example that
      # must not compile without them.
      - name: A build without the test-only features cannot send an interrupt
        if: matrix.profile == 'debug'
        run: |
          cargo test --locked -p ubc-vpn-platform --doc 2>&1 | tee doc.log
          grep -q "interrupt (line [0-9]*) - compile fail ... ok" doc.log
          # Nor a way to start a program in a terminal made for a test.
          grep -q "terminal (line [0-9]*) - compile fail ... ok" doc.log
      # A record of what the channel's rules meet on this runner: every
      # folder on the way to the installed socket must be root's alone.
      - name: The folders the installed channel relies on
        run: |
          uname -a
          if [ "$RUNNER_OS" = macOS ]; then
            sw_vers
            ls -ldn / /Library "/Library/Application Support" /var /private/var/run
          else
            ls -ldn / /run
          fi
      # sudo resets PATH and the toolchain's environment, so the tests are
      # built once here and the same program is then run as each user.
      - name: Build the tests
        run: |
          cargo test --locked -p ubc-vpn-platform --features dev-mode $PROFILE \
            --no-run --message-format=json > build.json
          tests=$(jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable) | .executable' build.json)
          test -x "$tests"
          echo "TESTS=$tests" >> "$GITHUB_ENV"
        env:
          PROFILE: ${{ matrix.profile == 'release' && '--release' || '' }}
      - name: Tests as an ordinary user, in dev mode
        run: |
          "$TESTS" --nocapture 2>&1 | tee user.log
          if grep "SKIPPED, needs dev mode" user.log; then
            echo "A test that needs no root was skipped."
            exit 1
          fi
          # A runner has no terminal of its own, so the real call is tried.
          if ! grep -qx "RAN: no terminal" user.log; then
            echo "The call without a terminal was not tried."
            exit 1
          fi
      # The variable turns every "SKIPPED, needs root" into a failure.
      - name: Tests as root, with other users to play the stranger
        run: sudo env UBC_VPN_REQUIRE_ROOT=1 "$TESTS" --nocapture 2>&1 | tee root.log
      # A test that is skipped passes. So prove from the log that each test
      # needing root really ran: every name listed in
      # .github/ran/platform-unix/<os>/*.txt.
      - name: The root-only tests really ran
        run: |
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          bash .github/ran/check.sh ".github/ran/platform-unix/$os" "RAN AS ROOT: " root.log
          if grep "SKIPPED" root.log; then
            echo "A test was skipped."
            exit 1
          fi
      # The interrupt handler asks the kernel through the C library's
      # `syscall`, which Apple discourages and may remove. It is looked up by
      # name when it is needed. Were a program to link to it instead, that
      # program would not start at all on a macOS without it, and one of
      # them is the service. So the programs as shipped must not name it
      # among the functions they need from outside.
      - name: The programs do not link to syscall
        if: runner.os == 'macOS' && matrix.profile == 'release'
        run: |
          # One program at a time, as a release is built.
          cargo build --locked --release -p ubc-vpn-service
          cargo build --locked --release -p ubc-vpn-cli
          for program in ubc-vpn-service ubc-vpn; do
            nm -u "target/release/$program" > needed.txt
            # The check must be able to find a function a program does link
            # to, or it would pass by finding nothing at all.
            if ! grep -qE '(^|[[:space:]])_write$' needed.txt; then
              echo "$program: the list of what it links to could not be read."
              exit 1
            fi
            if grep -E '(^|[[:space:]])_syscall$' needed.txt; then
              echo "$program links to syscall."
              exit 1
            fi
            echo "$program: $(wc -l < needed.txt) functions from outside, syscall not among them."
          done

  # The systemd unit, installed by `ubc-vpn-service install` from a release
  # build placed where the Linux packages will put it, and tried for real by
  # packaging/linux/tests/systemd.sh: running, owned, reinstalled, connected
  # through ocserv in a network namespace under the hardened unit, stopped
  # and removed. On GitHub's Ubuntu 22.04 runners only, where systemd is PID
  # 1, sudo needs no password and the pinned ocserv exists; they are thrown
  # away after the job. The job uses no secrets.
  systemd:
    name: systemd unit (linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    # `actions: read` is for downloading our libopenconnect from the native
    # library workflow's newest good run on main.
    permissions:
      contents: read
      actions: read
    env:
      BIN: /opt/UBC VPN/resources/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in engine.yml: only a run started by a push to main counts, and
      # the commit the library was built from must be on main.
      - name: Fetch the native library built on main
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: native-linux.yml
          ARTIFACT: libopenconnect-linux-x64
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --branch main \
            --event push --status success --limit 1 --json databaseId,headSha \
            --jq '.[0] | "\(.databaseId) \(.headSha)"')
          read -r id sha <<<"$run"
          [[ $id =~ ^[0-9]+$ ]]
          echo "Run $id of $WORKFLOW, at commit $sha"
          gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir download
          mkdir native
          tar -xzf "download/$ARTIFACT.tar.gz" -C native
          commit=$(jq -r '.build.repository_commit // empty' native/manifest.json)
          [[ $commit =~ ^[0-9a-f]{40}$ ]]
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$commit...main" --jq .status)
          echo "The library was built from $commit; main is $status of it."
          [ "$status" = ahead ] || [ "$status" = identical ]

      # A stalled download would otherwise hold the job until its own limit.
      - name: Install the pinned Rust toolchain
        id: toolchain
        timeout-minutes: 4
        continue-on-error: true
        run: rustup toolchain install
      - name: Install the pinned Rust toolchain, second try
        if: steps.toolchain.outcome != 'success'
        timeout-minutes: 4
        run: rustup toolchain install
      # Restores the build of our dependencies, keyed by the toolchain, the
      # OS, the job and the lockfile.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: platform-unix-systemd
          # Pull requests restore main's caches but save none of their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The client's keyring links the system's libdbus-1, and the test needs
      # ocserv: all at the versions pinned in test-packages.sh, from its
      # dated Ubuntu snapshot. The cache engine.yml keeps is only read here;
      # the script checks every package again regardless.
      - name: Restore the pinned packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/ubc-vpn-test-packages
          key: test-packages-ubuntu-22.04-${{ hashFiles('native/linux/test-packages.sh') }}-pkg-config-libdbus-1-dev-ocserv
      # ocserv's packaged service is kept from starting; systemd.sh starts
      # its own.
      - name: Install the pinned packages
        env:
          TEST_PACKAGES_CACHE: /var/tmp/ubc-vpn-test-packages
        run: |
          mkdir "$RUNNER_TEMP/packages"
          bash native/linux/test-packages.sh "$RUNNER_TEMP/packages" pkg-config libdbus-1-dev ocserv
          sudo systemctl disable ocserv.service
          if systemctl is-active --quiet ocserv.service; then exit 1; fi

      # One program at a time, with the real engine only, as a release
      # builds them. No rpath, as in the Linux test bundle.
      - name: Build the service and the client
        env:
          UBC_VPN_NATIVE_DIR: ${{ runner.temp }}/native
          RUSTFLAGS: ""
        run: |
          for package in ubc-vpn-service ubc-vpn-cli; do
            cargo build --locked --release -p "$package" --features real-engine
          done

      # Root's, as the packages will install them: the service refuses to
      # run from a folder anyone else could change. The library is the file
      # itself, never a link. GitHub's image leaves /opt open to everyone
      # (0777, with an access list), which the service rightly refuses, so
      # on this throwaway runner it is closed as a system's own /opt is.
      - name: Place the release build where the unit starts it
        run: |
          ls -ldn / /opt
          sudo setfacl -b /opt
          sudo chmod 0755 /opt
          ls -ldn /opt
          sudo install -d -o root -g root -m 0755 "/opt/UBC VPN" "/opt/UBC VPN/resources" "$BIN"
          sudo install -o root -g root -m 0755 target/release/ubc-vpn-service target/release/ubc-vpn "$BIN/"
          sudo install -o root -g root -m 0644 "$(readlink -f "$RUNNER_TEMP/native/lib/libopenconnect.so.5")" \
            "$BIN/libopenconnect.so.5"
          ls -ln "$BIN"

      - name: Install, use and remove the unit
        env:
          UBC_VPN_TEST_THROWAWAY_MACHINE: "1"
        run: bash packaging/linux/tests/systemd.sh "$RUNNER_TEMP/systemd" 2>&1 | tee systemd.log

      # A check that is skipped passes, so prove from the log that each ran.
      - name: Every check ran
        run: |
          bash .github/ran/check.sh .github/ran/systemd/linux "RAN: " systemd.log

      # What the service logs holds no secret. ocserv's log is filtered as
      # in engine.yml, though its account is made up.
      - name: What the service and ocserv logged
        if: failure()
        run: |
          journalctl -u ubc-vpn.service -o cat --no-pager | tail -n 200 || true
          { sudo cat "$RUNNER_TEMP/systemd/ocserv.log" 2> /dev/null || true
            sudo journalctl --no-pager -o short-precise -t ocserv || true; } \
            | grep -viE 'password' | grep -vE 'TLS\[' \
            | sed -E 's/[A-Za-z0-9+\/=_-]{16,}/[hidden]/g' | tail -n 100

      - name: No ubcvpn link is left
        if: always()
        run: |
          if ip -o link show | grep ubcvpn; then exit 1; fi
          echo "No ubcvpn link is left."

  # The launchd job, installed by `ubc-vpn-service install` from a release
  # build placed where the macOS package will put it, and tried for real by
  # packaging/macos/tests/launchd.sh: running under launchd, owned,
  # reinstalled, killed and started again, stopped and removed. Nothing
  # connects. On GitHub's macOS runners, where sudo needs no password; they
  # are thrown away after the job. The job uses no secrets.
  launchd:
    name: launchd job (macos)
    runs-on: macos-15
    timeout-minutes: 30
    # `actions: read` is for downloading our libopenconnect from the native
    # library workflow's newest good run on main.
    permissions:
      contents: read
      actions: read
    env:
      FOLDER: /Library/PrivilegedHelperTools/io.github.nima-hs.ubc-vpn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in engine.yml: only a run started by a push to main counts, and
      # the commit the library was built from must be on main.
      - name: Fetch the native library built on main
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: native-macos.yml
          ARTIFACT: libopenconnect-macos-arm64
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --branch main \
            --event push --status success --limit 1 --json databaseId,headSha \
            --jq '.[0] | "\(.databaseId) \(.headSha)"')
          read -r id sha <<<"$run"
          [[ $id =~ ^[0-9]+$ ]]
          echo "Run $id of $WORKFLOW, at commit $sha"
          gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir download
          mkdir native
          tar -xzf "download/$ARTIFACT.tar.gz" -C native
          if [ -d "native/$ARTIFACT" ]; then mv "native/$ARTIFACT" unwrapped && rmdir native && mv unwrapped native; fi
          # macOS records it as recipe.commit.
          commit=$(jq -r '.recipe.commit // empty' native/manifest.json)
          [[ $commit =~ ^[0-9a-f]{40}$ ]]
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$commit...main" --jq .status)
          echo "The library was built from $commit; main is $status of it."
          [ "$status" = ahead ] || [ "$status" = identical ]

      # A stalled download would otherwise hold the job until its own limit.
      - name: Install the pinned Rust toolchain
        id: toolchain
        timeout-minutes: 4
        continue-on-error: true
        run: rustup toolchain install
      - name: Install the pinned Rust toolchain, second try
        if: steps.toolchain.outcome != 'success'
        timeout-minutes: 4
        run: rustup toolchain install
      # Restores the build of our dependencies, keyed by the toolchain, the
      # OS, the job and the lockfile.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: platform-unix-launchd
          # Pull requests restore main's caches but save none of their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # One program at a time, with the real engine only, as a release
      # builds them. No rpath: the engine loads the library by its full path.
      - name: Build the service and the client
        env:
          UBC_VPN_NATIVE_DIR: ${{ runner.temp }}/native
          RUSTFLAGS: ""
        run: |
          for package in ubc-vpn-service ubc-vpn-cli; do
            cargo build --locked --release -p "$package" --features real-engine
          done

      # Root's, as the package will install them: the service refuses to run
      # from a folder anyone else could change. The libraries are the files
      # themselves, never the link bundle.sh adds for the linker. Copied as
      # they are, so their ad-hoc signatures stay.
      - name: Place the release build where the job starts it
        run: |
          sudo install -d -o root -g wheel -m 1755 /Library/PrivilegedHelperTools
          sudo install -d -o root -g wheel -m 755 "$FOLDER"
          sudo install -o root -g wheel -m 755 target/release/ubc-vpn-service target/release/ubc-vpn "$FOLDER/"
          find "$RUNNER_TEMP/native/lib" -maxdepth 1 -type f -name '*.dylib' \
            -exec sudo install -o root -g wheel -m 644 {} "$FOLDER/" \;
          ls -ln "$FOLDER"

      - name: Install, use and remove the job
        env:
          UBC_VPN_TEST_THROWAWAY_MACHINE: "1"
        run: bash packaging/macos/tests/launchd.sh "$RUNNER_TEMP/launchd" 2>&1 | tee launchd.log

      # A check that is skipped passes, so prove from the log that each ran.
      - name: Every check ran
        run: |
          bash .github/ran/check.sh .github/ran/launchd/macos "RAN: " launchd.log

      - name: What the service logged
        if: failure()
        run: |
          sudo launchctl print system/io.github.nima-hs.ubc-vpn || true
          sudo tail -n 100 "/Library/Application Support/UBC VPN/service.log" || true
