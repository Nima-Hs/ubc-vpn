name: Platform (Unix)

# The Unix socket channel is the boundary between ordinary programs and the
# root-level service. Some of its rules can only be tested by root with a
# second user to play the stranger, which a developer machine does not offer
# by default. GitHub's Linux and macOS runners have passwordless sudo, so
# those tests run here, and this workflow fails if any of them was skipped.

on:
  pull_request:
    paths:
      - crates/platform/**
      - crates/core/**
      # The programs this workflow builds and looks into on macOS.
      - crates/service/**
      - crates/cli/**
      - crates/engine/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/platform-unix.yml
  push:
    branches: [main]
    paths:
      - crates/platform/**
      - crates/core/**
      # The programs this workflow builds and looks into on macOS.
      - crates/service/**
      - crates/cli/**
      - crates/engine/**
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/platform-unix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-unix-${{ github.ref }}
  cancel-in-progress: true

# Named outright, because only then does a failing test at the head of a
# pipe fail the step.
defaults:
  run:
    shell: bash

jobs:
  channel:
    name: channel (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A stalled download would otherwise hold the job until its own limit.
      - name: Install the pinned Rust toolchain
        id: toolchain
        timeout-minutes: 4
        continue-on-error: true
        run: rustup toolchain install
      - name: Install the pinned Rust toolchain, second try
        if: steps.toolchain.outcome != 'success'
        timeout-minutes: 4
        run: rustup toolchain install
      - name: Dev-mode code is free of warnings
        if: matrix.profile == 'debug'
        run: cargo clippy --locked -p ubc-vpn-platform --features dev-mode --all-targets -- -D warnings
      # Without the test-only features there must be no way to send a program
      # a request to stop. The crate's documentation has an example that
      # must not compile without them.
      - name: A build without the test-only features cannot send an interrupt
        if: matrix.profile == 'debug'
        run: |
          cargo test --locked -p ubc-vpn-platform --doc 2>&1 | tee doc.log
          grep -q "interrupt (line [0-9]*) - compile fail ... ok" doc.log
          # Nor a way to start a program in a terminal made for a test.
          grep -q "terminal (line [0-9]*) - compile fail ... ok" doc.log
      # A record of what the channel's rules meet on this runner: every
      # folder on the way to the installed socket must be root's alone.
      - name: The folders the installed channel relies on
        run: |
          uname -a
          if [ "$RUNNER_OS" = macOS ]; then
            sw_vers
            ls -ldn / /Library "/Library/Application Support" /var /private/var/run
          else
            ls -ldn / /run
          fi
      # sudo resets PATH and the toolchain's environment, so the tests are
      # built once here and the same program is then run as each user.
      - name: Build the tests
        run: |
          cargo test --locked -p ubc-vpn-platform --features dev-mode $PROFILE \
            --no-run --message-format=json > build.json
          tests=$(jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable) | .executable' build.json)
          test -x "$tests"
          echo "TESTS=$tests" >> "$GITHUB_ENV"
        env:
          PROFILE: ${{ matrix.profile == 'release' && '--release' || '' }}
      - name: Tests as an ordinary user, in dev mode
        run: |
          "$TESTS" --nocapture 2>&1 | tee user.log
          if grep "SKIPPED, needs dev mode" user.log; then
            echo "A test that needs no root was skipped."
            exit 1
          fi
          # A runner has no terminal of its own, so the real call is tried.
          if ! grep -qx "RAN: no terminal" user.log; then
            echo "The call without a terminal was not tried."
            exit 1
          fi
      # The variable turns every "SKIPPED, needs root" into a failure.
      - name: Tests as root, with other users to play the stranger
        run: sudo env UBC_VPN_REQUIRE_ROOT=1 "$TESTS" --nocapture 2>&1 | tee root.log
      # A test that is skipped passes. So prove from the log that each test
      # needing root really ran.
      - name: The root-only tests really ran
        run: |
          tests=("squatted socket" narrowing suite dev)
          # macOS alone lets a file's owner mark it unchangeable.
          if [ "$RUNNER_OS" = macOS ]; then tests+=(flags "flags loop"); fi
          for test in "${tests[@]}"; do
            if ! grep -qx "RAN AS ROOT: $test" root.log; then
              echo "The root-only test '$test' did not run."
              exit 1
            fi
          done
          if grep "SKIPPED" root.log; then
            echo "A test was skipped."
            exit 1
          fi
      # The interrupt handler asks the kernel through the C library's
      # `syscall`, which Apple discourages and may remove. It is looked up by
      # name when it is needed. Were a program to link to it instead, that
      # program would not start at all on a macOS without it, and one of
      # them is the service. So the programs as shipped must not name it
      # among the functions they need from outside.
      - name: The programs do not link to syscall
        if: runner.os == 'macOS' && matrix.profile == 'release'
        run: |
          # One program at a time, as a release is built.
          cargo build --locked --release -p ubc-vpn-service
          cargo build --locked --release -p ubc-vpn-cli
          for program in ubc-vpn-service ubc-vpn; do
            nm -u "target/release/$program" > needed.txt
            # The check must be able to find a function a program does link
            # to, or it would pass by finding nothing at all.
            if ! grep -qE '(^|[[:space:]])_write$' needed.txt; then
              echo "$program: the list of what it links to could not be read."
              exit 1
            fi
            if grep -E '(^|[[:space:]])_syscall$' needed.txt; then
              echo "$program links to syscall."
              exit 1
            fi
            echo "$program: $(wc -l < needed.txt) functions from outside, syscall not among them."
          done
