name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A stalled download would otherwise hold the job until its own limit.
      - name: Install the pinned Rust toolchain
        id: toolchain
        timeout-minutes: 4
        continue-on-error: true
        run: rustup toolchain install
      - name: Install the pinned Rust toolchain, second try
        if: steps.toolchain.outcome != 'success'
        timeout-minutes: 4
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Generated from crates/core by the tests. Deleting them first means a stale or
      # missing file shows up as a difference.
      - name: Clear generated TypeScript types
        if: matrix.os == 'ubuntu-latest'
        run: rm -rf app/src/shared/protocol
      - run: cargo test --locked --workspace
      # Some rules only exist in release builds, such as dropping the VPN
      # library's debug output, so their tests must run in release mode too.
      - name: Release-mode tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --workspace --release
      # Code behind these switches is not built by the steps above, so it would
      # otherwise only ever be checked on a developer machine.
      - name: Dev-mode and fake code builds and passes its tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo clippy --locked -p ubc-vpn-platform --features dev-mode --all-targets -- -D warnings
          cargo test --locked -p ubc-vpn-platform --features dev-mode
          cargo clippy --locked -p ubc-vpn-engine --features fake,debug-logs --all-targets -- -D warnings
          cargo test --locked -p ubc-vpn-engine --features fake,debug-logs
      # The workspace run above builds the engine with its fake feature, which
      # the service's tests ask for. The examples that show what a shipped
      # engine cannot reach only mean something without it.
      - name: The engine's examples hold without the fake feature
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p ubc-vpn-engine --doc
      # Saved passwords in the real OS keyring, under a throwaway service
      # name: Credential Manager on Windows, the Keychain on macOS. This is
      # the only place the real keyring is ever used by a test. The Linux
      # Secret Service test is tracked in #198.
      - name: The real keyring saves, reads and forgets
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        env:
          UBC_VPN_REAL_KEYRING: "1"
        run: |
          cargo test --locked -p ubc-vpn-platform --lib -- --exact \
            secrets::tests::the_real_keyring_saves_reads_and_forgets --nocapture | tee keyring.log
          grep -qx "RAN: real keyring" keyring.log
      # On every OS: a dev-mode service runs on that OS's real channel, so its
      # tests do different things on each. The CLI's dev mode is the other end
      # of that channel.
      - name: The service's and the CLI's dev mode build and pass their tests
        # PowerShell, the default on Windows, carries on after a failing
        # command and reports only the last one.
        shell: bash
        run: |
          cargo clippy --locked -p ubc-vpn-service --features dev-mode --all-targets -- -D warnings
          cargo test --locked -p ubc-vpn-service --features dev-mode
          cargo clippy --locked -p ubc-vpn-cli --features dev-mode --all-targets -- -D warnings
          cargo test --locked -p ubc-vpn-cli --features dev-mode
      # A release must be built one program at a time (-p), never with
      # --workspace: features enabled by any other crate would be switched on
      # for these two as well.
      #
      # Naming rule this check relies on: any feature of a workspace crate that
      # must not ship has "dev", "fake" or "debug" in its name.
      - name: The service and the CLI ship no dev-mode, fake or debug code
        if: matrix.os == 'ubuntu-latest'
        run: |
          pattern='^ubc-vpn-.*\[.*(dev|fake|debug)'
          # A broken pattern makes grep fail, which looks the same as "nothing
          # found". So first prove the pattern matches what it is meant to.
          grep -Eq "$pattern" <<<'ubc-vpn-example v0.0.0 (path) [dev-mode,fake]'
          for program in ubc-vpn-service ubc-vpn-cli; do
            # Capture first, so a failing cargo tree fails the step instead of
            # looking like "nothing found". The format prints each crate with
            # the features it would really be built with, on every target.
            tree=$(cargo tree --locked -p "$program" -e normal --target all --prefix none -f '{p} [{f}]')
            if grep -E "$pattern" <<<"$tree"; then
              echo "$program would ship code meant for development only."
              exit 1
            fi
          done
      - name: Generated TypeScript types match the Rust types
        if: matrix.os == 'ubuntu-latest'
        run: |
          changed=$(git status --porcelain -- app/src/shared/protocol)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "Run cargo test and commit app/src/shared/protocol."
            exit 1
          fi

  # The single required check. It keeps one stable name while the jobs behind
  # it change, and fails if any of them failed or was skipped.
  check:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.test.result }}" = "success"

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
