name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A stalled download would otherwise hold the job until its own limit.
      - name: Install the pinned Rust toolchain
        id: toolchain
        timeout-minutes: 4
        continue-on-error: true
        run: rustup toolchain install
      - name: Install the pinned Rust toolchain, second try
        if: steps.toolchain.outcome != 'success'
        timeout-minutes: 4
        run: rustup toolchain install
      # Restores the build of our dependencies, not of our own crates, which
      # are always built again. After the toolchain: its version is part of
      # the key, as are the OS, the job and the lockfile.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci
          # Pull requests restore main's caches but save none of their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The command-line client's keyring links the system's libdbus-1 on
      # Linux: its headers and pkg-config, at the versions pinned in
      # test-packages.sh, from its dated Ubuntu snapshot.
      - name: Install the pinned D-Bus headers
        if: runner.os == 'Linux'
        run: |
          mkdir "$RUNNER_TEMP/packages"
          bash native/linux/test-packages.sh "$RUNNER_TEMP/packages" pkg-config libdbus-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Generated from crates/core by the tests. Deleting them first means a stale or
      # missing file shows up as a difference.
      - name: Clear generated TypeScript types
        if: matrix.os == 'ubuntu-latest'
        run: rm -rf app/src/shared/protocol
      - run: cargo test --locked --workspace
      # Some rules only exist in release builds, such as dropping the VPN
      # library's debug output, so their tests must run in release mode too.
      - name: Release-mode tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --workspace --release
      # libdbus-1 (AFL-2.1 OR GPL-2.0+) is allowed only as the system's own
      # library: the command-line client must load it at run time and never
      # carry a copy (.claude/rules/dependencies.md). So the D-Bus
      # crates are never built with their `vendored` feature, which compiles
      # libdbus into the program, on any target or feature set, and the
      # program built above names libdbus-1.so.3 among the libraries it
      # loads.
      - name: The command-line client links the system's libdbus at run time
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Capture first, so a failing cargo tree fails the step instead of
          # looking like "nothing found".
          tree=$(cargo tree --locked --workspace --all-features --target all -e features -i libdbus-sys --prefix none)
          # The check must find the crate, or it would pass by finding nothing.
          if ! grep -q '^libdbus-sys v' <<<"$tree"; then
            echo "libdbus-sys is not in the tree, so this check proves nothing."
            exit 1
          fi
          if grep -E '^libdbus-sys feature "vendored"' <<<"$tree"; then
            echo "libdbus would be compiled into a program instead of loaded from the system."
            exit 1
          fi
          needed=$(readelf -d target/release/ubc-vpn | grep '(NEEDED)')
          echo "$needed"
          # The list must be readable, or the next check would prove nothing.
          grep -q '\[libc\.so\.6\]' <<<"$needed"
          if ! grep -q '\[libdbus-1\.so\.3\]' <<<"$needed"; then
            echo "ubc-vpn does not load libdbus-1.so.3 from the system."
            exit 1
          fi
      # The profiles in Cargo.toml: debug builds keep line tables for our own
      # crates and no debug info for dependencies, and release builds keep
      # what they always had, with debug assertions off, since the rules
      # tested above exist only there. Read from the compiler's command lines
      # in a build of its own, so every crate is compiled and shown.
      - name: Debug builds keep line tables only, release builds are unchanged
        if: matrix.os == 'ubuntu-latest'
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/profiles"
          cargo build --locked -p ubc-vpn-core -v > dev.log 2>&1
          cargo build --locked -p ubc-vpn-core --release -v > release.log 2>&1
          # check <log> <crate> <expected>: the debug info, debug assertion
          # and optimization flags the compiler was given for that crate.
          check() {
            local call
            call=$(grep -E "Running \`[^ ]*rustc(\.exe)? --crate-name $2 " "$1") || { echo "No compiler call for $2 in $1."; exit 1; }
            local got
            got=$({ grep -oE -- '-C (debuginfo|debug-assertions|opt-level)=[^ ]+' <<< "$call" || true; } | sort | paste -sd ' ')
            if [ "$got" != "$3" ]; then
              echo "$2 in $1: expected '$3', got '$got'."
              exit 1
            fi
          }
          check dev.log ubc_vpn_core "-C debuginfo=line-tables-only"
          check dev.log serde_json ""
          check release.log ubc_vpn_core "-C opt-level=3"
          check release.log serde_json "-C opt-level=3"
      # Code behind these switches is not built by the steps above, so it would
      # otherwise only ever be checked on a developer machine.
      - name: Dev-mode and fake code builds and passes its tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo clippy --locked -p ubc-vpn-platform --features dev-mode --all-targets -- -D warnings
          cargo test --locked -p ubc-vpn-platform --features dev-mode
          cargo clippy --locked -p ubc-vpn-engine --features fake,debug-logs --all-targets -- -D warnings
          cargo test --locked -p ubc-vpn-engine --features fake,debug-logs
      # The workspace run above builds the engine with its fake feature, which
      # the service's tests ask for. The examples that show what a shipped
      # engine cannot reach only mean something without it.
      - name: The engine's examples hold without the fake feature
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p ubc-vpn-engine --doc
      # Saved passwords in the real OS keyring, under a throwaway service
      # name: Credential Manager on Windows, the Keychain on macOS. This is
      # the only place the real keyring is ever used by a test. The Linux
      # Secret Service test is tracked in #198.
      - name: The real keyring saves, reads and forgets
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        env:
          UBC_VPN_REAL_KEYRING: "1"
        run: |
          cargo test --locked -p ubc-vpn-platform --features secrets --lib -- --exact \
            secrets::tests::the_real_keyring_saves_reads_and_forgets --nocapture | tee keyring.log
          grep -qx "RAN: real keyring" keyring.log
      # The service runs as another account and never sees a password, so it
      # must not link the keyring at all. Only the command-line client turns
      # on the platform crate's `secrets` feature. Checked for every OS's
      # target, with the service built by itself as a release builds it.
      - name: The service links no keyring
        if: matrix.os == 'ubuntu-latest'
        run: |
          for target in x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            tree=$(cargo tree --locked -p ubc-vpn-service --target "$target" -e normal,build)
            if grep -E 'keyring|zbus|dbus' <<<"$tree"; then
              echo "The service would link the keyring for $target."
              exit 1
            fi
          done
      # On every OS: a dev-mode service runs on that OS's real channel, so its
      # tests do different things on each. The CLI's dev mode is the other end
      # of that channel.
      - name: The service's and the CLI's dev mode build and pass their tests
        # PowerShell, the default on Windows, carries on after a failing
        # command and reports only the last one.
        shell: bash
        run: |
          cargo clippy --locked -p ubc-vpn-service --features dev-mode --all-targets -- -D warnings
          cargo test --locked -p ubc-vpn-service --features dev-mode
          cargo clippy --locked -p ubc-vpn-cli --features dev-mode --all-targets -- -D warnings
          cargo test --locked -p ubc-vpn-cli --features dev-mode
      # A release must be built one program at a time (-p), never with
      # --workspace: features enabled by any other crate would be switched on
      # for these two as well.
      #
      # Naming rule this check relies on: any feature of a workspace crate that
      # must not ship has "dev", "fake" or "debug" in its name.
      - name: The service and the CLI ship no dev-mode, fake or debug code
        if: matrix.os == 'ubuntu-latest'
        run: |
          pattern='^ubc-vpn-.*\[.*(dev|fake|debug)'
          # A broken pattern makes grep fail, which looks the same as "nothing
          # found". So first prove the pattern matches what it is meant to.
          grep -Eq "$pattern" <<<'ubc-vpn-example v0.0.0 (path) [dev-mode,fake]'
          for program in ubc-vpn-service ubc-vpn-cli; do
            # Capture first, so a failing cargo tree fails the step instead of
            # looking like "nothing found". The format prints each crate with
            # the features it would really be built with, on every target.
            tree=$(cargo tree --locked -p "$program" -e normal --target all --prefix none -f '{p} [{f}]')
            if grep -E "$pattern" <<<"$tree"; then
              echo "$program would ship code meant for development only."
              exit 1
            fi
          done
      - name: Generated TypeScript types match the Rust types
        if: matrix.os == 'ubuntu-latest'
        run: |
          changed=$(git status --porcelain -- app/src/shared/protocol)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "Run cargo test and commit app/src/shared/protocol."
            exit 1
          fi

  # The scripts behind the mutation tests (.github/workflows/mutants.yml),
  # on both OSes they run on, and the rules of that workflow.
  mutants-tools:
    name: mutation test scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/mutants/test.sh
        shell: bash

  # The single required check. It keeps one stable name while the jobs behind
  # it change, and fails if any of them failed or was skipped.
  check:
    if: always()
    needs: [test, mutants-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.test.result }}" = "success"
      - run: test "${{ needs.mutants-tools.result }}" = "success"

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
