name: Engine

# The real engine loads libopenconnect, which the ordinary CI does not have.
# This workflow takes our own build of it from the newest good run of the
# native-library workflow on main, and proves on each OS that the engine
# crate loads it at run time from the folder it is given, and can call it.

on:
  pull_request:
    paths:
      - crates/engine/**
      - native/linux/test-packages.sh
      - crates/core/**
      - crates/platform/**
      - crates/service/**
      - crates/cli/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/engine.yml
      # Last, so it wins: a change to Markdown files alone starts nothing.
      # None is built, tested or shipped. Any other file still counts.
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - crates/engine/**
      - native/linux/test-packages.sh
      - crates/core/**
      - crates/platform/**
      - crates/service/**
      - crates/cli/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/engine.yml
      - "!**/*.md"
  workflow_dispatch:

# `actions: read` is for listing the native-library runs and downloading
# their artifacts.
permissions:
  contents: read
  actions: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

# Naming the shell turns on pipefail, and on Windows it replaces PowerShell,
# which carries on after a failing command.
defaults:
  run:
    shell: bash

jobs:
  load:
    name: load (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # A run takes about two minutes. This stops one that hangs, such as on
    # a stand-in gateway that never answers.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The runners the native-library workflows test on.
          - { name: windows, os: windows-latest, artifact: libopenconnect-windows-x64 }
          - { name: macos, os: macos-14, artifact: libopenconnect-macos-arm64 }
          - { name: linux, os: ubuntu-22.04, artifact: libopenconnect-linux-x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only a run started by a push to main counts. A pull request from a
      # fork whose branch is called main also has "main" as its branch, and a
      # run started by hand can be on any branch.
      - name: Fetch the native library built on main
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: native-${{ matrix.name }}.yml
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --branch main \
            --event push --status success --limit 1 --json databaseId,headSha \
            --jq '.[0] | "\(.databaseId) \(.headSha)"')
          read -r id sha <<<"$run"
          [[ $id =~ ^[0-9]+$ ]]
          echo "Run $id of $WORKFLOW, at commit $sha"
          gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir download
          # Windows uploads the folder itself. The others upload a tarball, to
          # keep symbolic links; the macOS one has a top-level folder.
          if [ -f "download/$ARTIFACT.tar.gz" ]; then
            mkdir native
            tar -xzf "download/$ARTIFACT.tar.gz" -C native
            if [ -d "native/$ARTIFACT" ]; then mv "native/$ARTIFACT" unwrapped && rmdir native && mv unwrapped native; fi
          else
            mv download native
          fi

          # The commit of this repository the library was built from must be
          # on main (see native/windows/README.md). Windows and macOS record
          # it as recipe.commit, Linux as build.repository_commit.
          commit=$(jq -r '.recipe.commit // .build.repository_commit // empty' native/manifest.json)
          [[ $commit =~ ^[0-9a-f]{40}$ ]]
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$commit...main" --jq .status)
          echo "The library was built from $commit; main is $status of it."
          # "behind" and "diverged" mean the commit is not part of main.
          [ "$status" = ahead ] || [ "$status" = identical ]

      # A stalled download would otherwise hold the job until its own limit.
      - name: Install the pinned Rust toolchain
        id: toolchain
        timeout-minutes: 4
        continue-on-error: true
        run: rustup toolchain install
      - name: Install the pinned Rust toolchain, second try
        if: steps.toolchain.outcome != 'success'
        timeout-minutes: 4
        run: rustup toolchain install

      - name: The build refuses to look for a library by itself
        run: |
          if cargo check --locked -p ubc-vpn-engine --features libopenconnect 2> refused.txt; then
            echo "The build passed without being told where the library is."
            exit 1
          fi
          cat refused.txt
          grep -q 'set UBC_VPN_NATIVE_DIR' refused.txt

      - name: No libopenconnect is installed on the system
        if: runner.os == 'Linux'
        run: |
          if ldconfig -p | grep libopenconnect; then exit 1; fi

      # The binding as it ships, then as the tests see it: `fake` makes the
      # binding reachable from the tests and never ships.
      - name: Lint
        env:
          UBC_VPN_NATIVE_DIR: ${{ runner.temp }}/native
        run: |
          cargo clippy --locked -p ubc-vpn-engine --features libopenconnect --all-targets -- -D warnings
          cargo clippy --locked -p ubc-vpn-engine --features libopenconnect,fake --all-targets -- -D warnings

      # The login tests talk to a stand-in gateway written in Python
      # (crates/engine/tests/gateway). The tests are given the path of this
      # Python; it is not put on PATH.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.13.16"
          update-environment: false

      # Made for this run and gone with the runner: never committed, never
      # uploaded. The gateway's request logs go to the same folder.
      - name: Make a throwaway key for the stand-in gateway
        working-directory: ${{ runner.temp }}
        env:
          # Stops Git Bash on Windows from reading the subject as a path.
          MSYS_NO_PATHCONV: "1"
        run: |
          mkdir gateway
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=vpn.example.test" \
            -keyout gateway/key.pem -out gateway/cert.pem

      # One test needs a gateway whose certificate this machine's own store
      # trusts, to show that the engine asks its judge all the same. So a
      # throwaway authority is added to the store of this runner, which is
      # thrown away after the job. Its key never leaves runner.temp. Linux
      # only: it is the one runner where this is a single command. Never do
      # this on a machine that is kept; the test is skipped without the
      # variable set here. The step runs on GitHub's own runners only, so a
      # machine someone registers as a runner is never touched; the check of
      # the log below then fails there, which is the right answer.
      - name: Trust a throwaway authority on this runner
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir gateway-trusted && cd gateway-trusted
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=UBC VPN throwaway test authority" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign" \
            -keyout authority-key.pem -out authority.pem
          openssl req -newkey rsa:2048 -nodes -subj "/CN=vpn.example.test" -keyout key.pem -out request.pem
          printf 'subjectAltName=DNS:vpn.example.test\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > extensions
          openssl x509 -req -in request.pem -CA authority.pem -CAkey authority-key.pem -CAcreateserial \
            -days 2 -extfile extensions -out cert.pem
          sudo cp authority.pem /usr/local/share/ca-certificates/ubc-vpn-throwaway-test-authority.crt
          sudo update-ca-certificates
          echo "UBC_VPN_TEST_TRUSTED_GATEWAY_DIR=$PWD" >> "$GITHUB_ENV"

      # Some tests drive a real gateway (tests/ocserv.rs): ocserv, installed
      # at a pinned version from a dated Ubuntu snapshot and started as root
      # with the stand-in's throwaway key and a made-up account. Linux only,
      # on GitHub's own runners, which are thrown away after the job.
      - name: Start ocserv, a real gateway, on this runner
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir ocserv
          cp gateway/cert.pem gateway/key.pem ocserv/
          bash "$GITHUB_WORKSPACE/crates/engine/tests/ocserv/start.sh" ocserv
          echo "UBC_VPN_TEST_OCSERV_DIR=$PWD/ocserv" >> "$GITHUB_ENV"
          echo "UBC_VPN_TEST_REQUIRE_OCSERV=1" >> "$GITHUB_ENV"

      # The tunnel tests make a Wintun device, which needs administrator
      # rights, as GitHub's Windows runners have, and wintun.dll beside the
      # test programs: the library asks for it in the program's own folder.
      # It is the build pinned in native/windows/wintun.pin, checked against
      # the pinned checksum, for the tests only: never committed or uploaded.
      # Only on GitHub's own runners, which are thrown away after the job.
      - name: Put Wintun beside the test programs
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        working-directory: ${{ runner.temp }}
        run: |
          mapfile -t pin < "$GITHUB_WORKSPACE/native/windows/wintun.pin"
          [ "${#pin[@]}" -eq 2 ]
          [[ ${pin[0]} =~ ^WINTUN_URL=(https://www\.wintun\.net/builds/[A-Za-z0-9._-]+\.zip)$ ]]
          url=${BASH_REMATCH[1]}
          [[ ${pin[1]} =~ ^WINTUN_SHA256=([0-9a-f]{64})$ ]]
          sha=${BASH_REMATCH[1]}
          mkdir wintun-download && cd wintun-download
          curl -fsSLo wintun.zip "$url"
          echo "$sha *wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          for profile in debug release; do
            mkdir -p "$GITHUB_WORKSPACE/target/$profile/deps"
            cp wintun/bin/amd64/wintun.dll "$GITHUB_WORKSPACE/target/$profile/deps/"
          done
          echo "UBC_VPN_TEST_DEVICE=1" >> "$GITHUB_ENV"

      # The tests start themselves again with planted copies in the working
      # directory and the loader's search path. On macOS and Linux they build
      # a stand-in library with the runner's C compiler.
      - name: Load and call the library
        env:
          UBC_VPN_NATIVE_DIR: ${{ runner.temp }}/native
          UBC_VPN_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          UBC_VPN_TEST_GATEWAY_DIR: ${{ runner.temp }}/gateway
          # Turns a skipped gateway test into a failure.
          UBC_VPN_TEST_REQUIRE_GATEWAY: "1"
        run: |
          cargo test --locked -p ubc-vpn-engine --features libopenconnect,fake --tests -- --nocapture | tee test.log
          # Each of the gateway's nine scenarios ran.
          [ "$(grep -c '^RAN: gateway ' test.log)" = 9 ]
          # The real library logged in to it, and was refused by it.
          grep -q '^RAN: handle logs in' test.log
          grep -q '^RAN: handle rejects' test.log
          grep -q '^RAN: handle opens a tunnel connection' test.log
          # So did the engine.
          grep -q '^RAN: engine logs in' test.log
          grep -q '^RAN: engine refuses a wrong pin' test.log
          grep -q '^RAN: engine refuses single sign-on' test.log
          grep -q '^RAN: engine offers no single sign-on' test.log
          grep -q '^RAN: engine fetches a host-scan stub and runs nothing' test.log
          # And the tunnel engine.
          grep -q '^RAN: tunnel refuses a wrong pin' test.log
          grep -q '^RAN: tunnel asks for no dtls' test.log
          if [ "$RUNNER_OS" = Linux ]; then
            grep -q '^RAN: handle judges a trusted certificate' test.log
            grep -q '^RAN: engine refuses a trusted certificate' test.log
            grep -q '^RAN: tunnel refuses a trusted certificate' test.log
            grep -q '^RAN: ocserv takes a login and a tunnel connection' test.log
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            grep -q '^RAN: engine writes no key log' test.log
            grep -q '^RAN: tunnel makes and removes a device' test.log
            grep -q '^RAN: tunnel logs off only when asked' test.log
            grep -q '^RAN: tunnel reports a lost gateway' test.log
          else
            grep -q '^RAN: tunnel refuses at the device step' test.log
          fi
          # The examples that show the binding is private only mean something
          # in this configuration: the feature on and the fake off. The tests
          # that need no binding run in it too.
          cargo test --locked -p ubc-vpn-engine --features libopenconnect
          # A test that is skipped passes, so prove from the log that it ran.
          grep -E '^RAN: Ok\("v9\.21(-unknown)?"\)' test.log

      # The optimised build is the one that ships, and the one in which a
      # compiler may drop the C shim's wipe of its buffer.
      # When something failed, what ocserv said: no line that names a
      # password, and every long token, cookies included, hidden, though all
      # of them are made up.
      - name: What ocserv logged
        if: failure() && env.UBC_VPN_TEST_OCSERV_DIR != ''
        run: |
          { sudo cat "$UBC_VPN_TEST_OCSERV_DIR/ocserv.log"; sudo journalctl --no-pager -o cat -t ocserv; } \
            | grep -viE 'password' | grep -vE 'TLS\[' \
            | sed -E 's/[A-Za-z0-9+\/=_-]{16,}/[hidden]/g' | grep -v 'setting .* as ' | tail -n 150

      - name: The same tests in a release build
        env:
          UBC_VPN_NATIVE_DIR: ${{ runner.temp }}/native
          UBC_VPN_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          UBC_VPN_TEST_GATEWAY_DIR: ${{ runner.temp }}/gateway
          UBC_VPN_TEST_REQUIRE_GATEWAY: "1"
        run: cargo test --locked -p ubc-vpn-engine --features libopenconnect,fake --tests --release

      # The command-line client and the service built with the real engine,
      # as a release builds them: one program at a time. The client's test
      # copies it into folders of its own, with and without the libraries
      # beside it, and shows it loads them from there and nowhere else.
      - name: The client and the service with the real engine
        if: runner.os == 'Windows'
        env:
          UBC_VPN_NATIVE_DIR: ${{ runner.temp }}/native
        run: |
          cargo clippy --locked -p ubc-vpn-cli --features real-engine --all-targets -- -D warnings
          cargo clippy --locked -p ubc-vpn-service --features real-engine --all-targets -- -D warnings
          cargo test --locked -p ubc-vpn-cli --features real-engine --test real_engine
          # With dev mode as well, the service refuses to run as the installed one.
          cargo test --locked -p ubc-vpn-service --features real-engine,dev-mode --test binary

      # Every tunnel test removes its device on every path. Whatever the
      # tests reported, show that no Wintun adapter is left on the runner.
      - name: No tunnel device is left
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $left = @(Get-NetAdapter -IncludeHidden | Where-Object InterfaceDescription -like 'Wintun*')
          $left | Format-Table -AutoSize Name, InterfaceDescription, Status
          if ($left.Count -ne 0) { exit 1 }
          'No Wintun adapter is left.'
