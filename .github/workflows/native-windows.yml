name: Native library (Windows)

on:
  pull_request:
    paths:
      - native/windows/**
      - native/probe/**
      - .github/workflows/native-windows.yml
  push:
    branches: [main]
    paths:
      - native/windows/**
      - native/probe/**
      - .github/workflows/native-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  WINTUN_URL: https://www.wintun.net/builds/wintun-0.14.1.zip
  WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51

jobs:
  build:
    name: Build and probe libopenconnect
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build libopenconnect (MSYS2 UCRT64)
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env:
          MSYSTEM: UCRT64
          CHERE_INVOKING: "yes"
        run: |
          native/windows/setup.sh
          native/windows/build.sh

      - name: Check the manifest
        working-directory: native/windows/out
        run: |
          python -m json.tool manifest.json
          # Every DLL is listed, and Wintun is not bundled.
          for dll in bin/*.dll; do grep -qF "\"$dll\"" manifest.json; done
          test ! -e bin/wintun.dll

      - name: Build the probe (MSVC target)
        working-directory: native/probe
        run: |
          rustup toolchain install
          rustc -vV | grep '^host: x86_64-pc-windows-msvc$'
          cargo build --release --locked

      # The probe runs with a PATH of the build output and Windows itself, so
      # every DLL it loads is one we built or bundled.
      - name: Probe (certificate, login form and logging callbacks)
        working-directory: native/probe
        run: |
          windows=/c/Windows/System32:/c/Windows
          ours=$(cd ../windows/out/bin && pwd)
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 2 -subj "//CN=localhost"
          python fake_server.py cert.pem key.pem 4444 &
          sleep 3
          # Control: without the build output there is no libopenconnect to load,
          # so the probe cannot start and never prints a version.
          status=0
          PATH="$windows" ./target/release/oc-probe.exe probe https://127.0.0.1:4444 >control.txt 2>&1 || status=$?
          cat control.txt
          if [ "$status" = 0 ] || grep -q '^version' control.txt; then
            echo "the probe loaded a libopenconnect that is not ours"
            exit 1
          fi
          PATH="$ours:$windows" ./target/release/oc-probe.exe probe https://127.0.0.1:4444 | tee probe.txt
          grep -qE '^version  = v9\.21(-|$)' probe.txt
          grep -qx 'RESULT: PASS' probe.txt

      # Wintun is used for this test only. It is not part of the build output.
      - name: Connect (login, connection and Wintun tunnel device)
        working-directory: native/probe
        run: |
          windows=/c/Windows/System32:/c/Windows
          ours=$(cd ../windows/out/bin && pwd)
          curl -fsSLo wintun.zip "$WINTUN_URL"
          echo "$WINTUN_SHA256 *wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll target/release/
          python fake_server.py cert.pem key.pem 4445 &
          sleep 3
          PATH="$ours:$windows" ./target/release/oc-probe.exe connect https://127.0.0.1:4445 testuser testpass | tee connect.txt
          grep -qE '^version  = v9\.21(-|$)' connect.txt
          grep -qx 'RESULT: PASS' connect.txt

      # TEMPORARY, for the review of #7: which configuration paths the bundled
      # DLLs really look at. Reports only; removed before merge.
      - name: Investigate embedded search paths
        continue-on-error: true
        timeout-minutes: 8
        working-directory: native/probe
        run: |
          windows=/c/Windows/System32:/c/Windows
          ours=$(cd ../windows/out/bin && pwd)
          echo "::group::Absolute paths embedded in the DLLs"
          for dll in "$ours"/*.dll; do
            LC_ALL=C grep -a -o -E '[A-Za-z]:/[ -~]{4,}|(file://)?/ucrt64/[ -~]+' "$dll" | sort -u | sed "s|^|${dll##*/}: |" || true
          done
          echo "::endgroup::"

          # Plant a GnuTLS configuration that turns every TLS version off at the
          # path embedded in libgnutls-30.dll. If the probe now fails, it was read.
          mkdir -p /d/M/msys64/ucrt64/etc/gnutls
          printf '[overrides]\ndisabled-version = tls1.0\ndisabled-version = tls1.1\ndisabled-version = tls1.2\ndisabled-version = tls1.3\n' > /d/M/msys64/ucrt64/etc/gnutls/config
          python fake_server.py cert.pem key.pem 4448 &
          sleep 3
          if PATH="$ours:$windows" ./target/release/oc-probe.exe probe https://127.0.0.1:4448 >planted.txt 2>&1; then
            echo "PLANTED GNUTLS CONFIG: ignored, the probe still passes"
          else
            echo "PLANTED GNUTLS CONFIG: honoured, the probe now fails:"
            tail -20 planted.txt
          fi
          rm -rf /d/M

          curl -fsSLo procmon.zip https://download.sysinternals.com/files/ProcessMonitor.zip
          unzip -q procmon.zip -d procmon
          trace=$(cygpath -w "$PWD/trace.pml")
          csv=$(cygpath -w "$PWD/trace.csv")
          ./procmon/Procmon64.exe //AcceptEula //Quiet //Minimized //BackingFile "$trace" &
          procmon=$!
          ./procmon/Procmon64.exe //AcceptEula //WaitForIdle
          python fake_server.py cert.pem key.pem 4446 &
          python fake_server.py cert.pem key.pem 4447 &
          sleep 3
          PATH="$ours:$windows" ./target/release/oc-probe.exe probe https://127.0.0.1:4446 | tail -1 || true
          PATH="$ours:$windows" ./target/release/oc-probe.exe connect https://127.0.0.1:4447 testuser testpass | tail -1 || true
          ./procmon/Procmon64.exe //AcceptEula //Terminate
          wait "$procmon" || true
          ./procmon/Procmon64.exe //AcceptEula //OpenLog "$trace" //SaveAs "$csv"
          ls -l trace.csv
          grep -a '"oc-probe.exe"' trace.csv | awk -F'","' '{print $4 " | " $5 " | " $6}' | sort | uniq -c > probe-trace.txt || true
          echo "::group::Configuration-like paths the probe touched"
          grep -i -E 'ucrt64|msys64|pkcs11|\\etc\\|gnutls|locale|catalog|\.conf|[A-Z]:\\M\\' probe-trace.txt | head -300 || true
          echo "::endgroup::"
          echo "::group::Files the probe touched outside C:\\Windows"
          grep -v -E '\| (HK|C:\\Windows)' probe-trace.txt | grep -E '\| [A-Za-z]:' | head -300 || true
          echo "::endgroup::"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libopenconnect-windows-x64
          path: native/windows/out
          if-no-files-found: error
