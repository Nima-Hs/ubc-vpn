name: Native library (Windows)

on:
  pull_request:
    paths:
      - native/windows/**
      - native/probe/**
      - native/check-patches.sh
      - rust-toolchain.toml
      - .github/workflows/native-windows.yml
  push:
    branches: [main]
    paths:
      - native/windows/**
      - native/probe/**
      - native/check-patches.sh
      - rust-toolchain.toml
      - .github/workflows/native-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and probe libopenconnect
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      list-sha256: ${{ steps.record.outputs.list-sha256 }}
      wintun-url: ${{ steps.wintun.outputs.url }}
      wintun-sha256: ${{ steps.wintun.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the three builds apply the same patch
        run: bash native/check-patches.sh

      # The GnuTLS build takes most of the time, so pull requests may reuse one
      # made from these same files. Every test below still runs on the output,
      # but an output with a reused GnuTLS is never marked shippable. Builds of
      # main always build it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request'
        with:
          path: native/windows/cache/gnutls
          key: native-windows-gnutls-${{ hashFiles('native/windows/common.sh', 'native/windows/gnutls.sh', 'native/windows/patches/gnutls/*.patch', 'native/windows/base.lock', 'native/windows/packages.lock', 'native/windows/tools.lock', 'native/windows/sources.lock') }}

      # The build runs in an MSYS2 installed from a dated archive pinned in
      # base.lock, not in the one GitHub's image comes with.
      - name: Install the pinned MSYS2 base
        run: native/windows/base.sh /c/msys2-pinned

      - name: Build libopenconnect (MSYS2 UCRT64)
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env:
          MSYSTEM: UCRT64
          CHERE_INVOKING: "yes"
        run: |
          native/windows/setup.sh
          native/windows/build.sh
          native/windows/tests/control.sh

      - name: Scan the DLLs for paths and environment variables
        shell: C:\msys2-pinned\usr\bin\bash.exe -leo pipefail {0}
        env:
          MSYSTEM: UCRT64
          CHERE_INVOKING: "yes"
        run: native/windows/tests/scan-strings.sh

      - name: Check that the library has no external-browser login
        run: bash native/probe/no-external-browser.sh native/windows/out/bin/libopenconnect-5.dll

      - name: Check that PKCS#11 support is absent
        shell: C:\msys2-pinned\usr\bin\bash.exe -leo pipefail {0}
        env:
          MSYSTEM: UCRT64
          CHERE_INVOKING: "yes"
        run: native/windows/tests/no-pkcs11.sh

      - name: Check the manifest
        working-directory: native/windows/out
        run: |
          python -m json.tool manifest.json
          # Every DLL is listed, and Wintun is not bundled.
          for dll in bin/*.dll; do grep -qF "\"$dll\"" manifest.json; done
          test ! -e bin/wintun.dll
          # The recipe shipped with the source is exactly the files git tracks
          # in this folder of the repository: the same names, the same contents.
          diff <(git -C .. ls-files | sort) <(cd source/recipe && find . -type f | sed 's|^\./||' | sort)
          git -C .. ls-files | while read -r f; do cmp "../$f" "source/recipe/$f"; done
          # Nothing is shippable until the tests below have passed.
          python -c "import json; assert json.load(open('manifest.json'))['shippable'] is False"

      - name: Build the probe (MSVC target)
        working-directory: native/probe
        run: |
          rustup toolchain install
          rustc -vV | grep '^host: x86_64-pc-windows-msvc$'
          cargo build --release --locked

      # The probe runs with a PATH of the build output and Windows itself, so
      # every DLL it loads is one we built or bundled.
      - name: Probe (certificate, login form and logging callbacks)
        working-directory: native/probe
        run: |
          windows=/c/Windows/System32:/c/Windows
          ours=$(cd ../windows/out/bin && pwd)
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 2 -subj "//CN=localhost"
          python fake_server.py cert.pem key.pem 4444 &
          ./wait-for-server.sh 4444 $!
          # Control: without the build output there is no libopenconnect to load,
          # so the probe cannot start and never prints a version.
          status=0
          PATH="$windows" ./target/release/oc-probe.exe probe https://127.0.0.1:4444 >control.txt 2>&1 || status=$?
          cat control.txt
          if [ "$status" = 0 ] || grep -q '^version' control.txt; then
            echo "the probe loaded a libopenconnect that is not ours"
            exit 1
          fi
          PATH="$ours:$windows" ./target/release/oc-probe.exe probe https://127.0.0.1:4444 | tee probe.txt
          grep -qE '^version  = v9\.21(-|$)' probe.txt
          grep -qx 'RESULT: PASS' probe.txt

      # native/windows/wintun.pin is the one place the Wintun version and
      # checksum are written down. It must be exactly these two lines, so it
      # cannot set anything else in the environment.
      - name: Read the Wintun pin
        id: wintun
        run: |
          read_pin() {
            local url='^WINTUN_URL=https://www\.wintun\.net/builds/[A-Za-z0-9._-]+\.zip$'
            local sha='^WINTUN_SHA256=[0-9a-f]{64}$'
            local lines
            mapfile -t lines < "$1"
            [ "${#lines[@]}" -eq 2 ] && [[ ${lines[0]} =~ $url ]] && [[ ${lines[1]} =~ $sha ]] &&
              printf '%s\n' "${lines[@]}"
          }
          # A check that refuses nothing looks the same as one that passes, so
          # first prove it refuses what it must: another host, a third line,
          # a carriage return, the lines swapped, a short digest.
          digest=$(printf '07%.0s' {1..32})
          good='https://www.wintun.net/builds/w.zip'
          bad=$(mktemp)
          for sample in \
            "WINTUN_URL=https://example.com/w.zip\nWINTUN_SHA256=$digest\n" \
            "WINTUN_URL=$good\nWINTUN_SHA256=$digest\nGITHUB_PATH=x\n" \
            "WINTUN_URL=$good\r\nWINTUN_SHA256=$digest\n" \
            "WINTUN_SHA256=$digest\nWINTUN_URL=$good\n" \
            "WINTUN_URL=$good\nWINTUN_SHA256=${digest:1}\n"; do
            printf "$sample" > "$bad"
            if read_pin "$bad" > /dev/null; then
              echo "The pin check accepted a bad file."
              exit 1
            fi
          done
          printf "WINTUN_URL=$good\nWINTUN_SHA256=$digest\n" > "$bad"
          read_pin "$bad" > /dev/null
          read_pin native/windows/wintun.pin >> "$GITHUB_ENV"
          # The trace job needs the same pin; it takes it from here, checked.
          read_pin native/windows/wintun.pin | sed 's/^WINTUN_URL=/url=/; s/^WINTUN_SHA256=/sha256=/' >> "$GITHUB_OUTPUT"

      # Wintun is used for the tests only. It is not part of the build output.
      - name: Connect (login, connection and Wintun tunnel device)
        working-directory: native/probe
        run: |
          windows=/c/Windows/System32:/c/Windows
          ours=$(cd ../windows/out/bin && pwd)
          curl -fsSLo wintun.zip "$WINTUN_URL"
          echo "$WINTUN_SHA256 *wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll target/release/
          python fake_server.py cert.pem key.pem 4445 &
          ./wait-for-server.sh 4445 $!
          PATH="$ours:$windows" ./target/release/oc-probe.exe connect https://127.0.0.1:4445 testuser testpass | tee connect.txt
          grep -qE '^version  = v9\.21(-|$)' connect.txt
          grep -qx 'RESULT: PASS' connect.txt

      - name: Planted configuration files are ignored
        run: native/windows/tests/planted-files.sh

      # The jobs after this one work on a copy of the output fetched from
      # GitHub. Record what the output holds, so they can check their copy. The
      # record's own checksum leaves as a job output: an artifact can be
      # replaced by a later job that uploads the same name, a job output cannot.
      - name: Record the output
        id: record
        run: |
          native/windows/tests/seal.sh self-test
          list=$(cygpath -u "$RUNNER_TEMP")/seal/checksums.txt
          native/windows/tests/seal.sh record "$list"
          cat "$list"
          echo "list-sha256=$(sha256sum "$list" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libopenconnect-windows-x64-checksums
          path: ${{ runner.temp }}/seal/checksums.txt
          if-no-files-found: error

      # Not the artifact to use: its manifest says it is not shippable. The
      # approve job makes the one to use from it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libopenconnect-windows-x64-unapproved
          path: native/windows/out
          # The recipe has a .gitignore, which would otherwise be left out.
          include-hidden-files: true
          if-no-files-found: error

  # Process Monitor cannot be pinned and runs as administrator, so the trace
  # has a machine to itself. Nothing on this machine is uploaded: the job gives
  # the others only its result, pass or fail.
  trace:
    name: Trace what the probe touches
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libopenconnect-windows-x64-unapproved
          path: native/windows/out

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libopenconnect-windows-x64-checksums
          path: ${{ runner.temp }}/sealed

      - name: Check this is the output the build recorded
        env:
          LIST_SHA256: ${{ needs.build.outputs.list-sha256 }}
        run: native/windows/tests/seal.sh verify "$(cygpath -u "$RUNNER_TEMP")/sealed/checksums.txt" "$LIST_SHA256" before-approval

      - name: Build the probe (MSVC target)
        working-directory: native/probe
        run: |
          rustup toolchain install
          rustc -vV | grep '^host: x86_64-pc-windows-msvc$'
          cargo build --release --locked

      - name: Make a certificate and fetch Wintun
        working-directory: native/probe
        env:
          WINTUN_URL: ${{ needs.build.outputs.wintun-url }}
          WINTUN_SHA256: ${{ needs.build.outputs.wintun-sha256 }}
        run: |
          [ -n "$WINTUN_URL" ] && [ -n "$WINTUN_SHA256" ]
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 2 -subj "//CN=localhost"
          curl -fsSLo wintun.zip "$WINTUN_URL"
          echo "$WINTUN_SHA256 *wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll target/release/

      # The first connection on a machine makes Wintun install its driver,
      # which unpacks files into temporary folders. That is Wintun setting
      # itself up, not our libraries at work, so let it happen before the trace.
      - name: Connect once before tracing
        working-directory: native/probe
        run: |
          windows=/c/Windows/System32:/c/Windows
          ours=$(cd ../windows/out/bin && pwd)
          python fake_server.py cert.pem key.pem 4445 &
          ./wait-for-server.sh 4445 $!
          PATH="$ours:$windows" ./target/release/oc-probe.exe connect https://127.0.0.1:4445 testuser testpass | tee connect.txt
          grep -qx 'RESULT: PASS' connect.txt

      - name: Trace the files and registry keys the probe touches
        timeout-minutes: 10
        run: native/windows/tests/trace.sh

      # Kept when the job fails, so that a path the trace refuses can be traced
      # to the program that touched it. It holds the events of the probe and
      # the programs it started, without command lines or environments.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: native-windows-trace
          path: native/windows/work/procmon/probe-trace.tsv
          if-no-files-found: ignore

  # Marks the output shippable and uploads it, on a machine that has run
  # neither the build nor the trace tool. It starts only if both of those jobs
  # passed, and takes nothing from the trace job. Its copy of the output must
  # match the build's record, and the record must have the checksum the build
  # job gave out.
  approve:
    name: Approve and upload the output
    needs: [build, trace]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libopenconnect-windows-x64-unapproved
          path: native/windows/out

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libopenconnect-windows-x64-checksums
          path: ${{ runner.temp }}/sealed

      # An output whose GnuTLS was reused is uploaded too, but it is not
      # shippable and its name says so.
      - name: Mark the output shippable
        id: approve
        env:
          EVENT: ${{ github.event_name }}
        run: |
          native/windows/tests/approve.sh
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          m = json.load(open('native/windows/out/manifest.json'))
          built = next(c for c in m['components'] if c['name'] == 'gnutls')['built_in_this_run']
          assert m['shippable'] is built and (m['blockers'] == []) is built
          assert built or os.environ['EVENT'] == 'pull_request', 'only a pull request may reuse a GnuTLS build'
          print('suffix=' + ('' if built else '-reused-gnutls'))
          EOF

      # The last thing before the upload.
      - name: Check the output is what the build recorded
        env:
          LIST_SHA256: ${{ needs.build.outputs.list-sha256 }}
        run: native/windows/tests/seal.sh verify "$RUNNER_TEMP/sealed/checksums.txt" "$LIST_SHA256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libopenconnect-windows-x64${{ steps.approve.outputs.suffix }}
          path: native/windows/out
          # The recipe has a .gitignore, which would otherwise be left out.
          include-hidden-files: true
          if-no-files-found: error
