name: Native library (Windows)

on:
  pull_request:
    paths:
      - native/windows/**
      - native/probe/**
      - .github/workflows/native-windows.yml
  push:
    branches: [main]
    paths:
      - native/windows/**
      - native/probe/**
      - .github/workflows/native-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  WINTUN_URL: https://www.wintun.net/builds/wintun-0.14.1.zip
  WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51

jobs:
  build:
    name: Build and probe libopenconnect
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The GnuTLS build takes most of the time, so pull requests may reuse one
      # made from these same files. Every test below still runs on the output,
      # but an output with a reused GnuTLS is never marked shippable. Builds of
      # main always build it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request'
        with:
          path: native/windows/cache/gnutls
          key: native-windows-gnutls-${{ hashFiles('native/windows/common.sh', 'native/windows/gnutls.sh', 'native/windows/patches/gnutls/*.patch', 'native/windows/packages.lock', 'native/windows/tools.lock', 'native/windows/sources.lock') }}

      - name: Build libopenconnect (MSYS2 UCRT64)
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env:
          MSYSTEM: UCRT64
          CHERE_INVOKING: "yes"
        run: |
          native/windows/setup.sh
          native/windows/build.sh
          native/windows/tests/control.sh

      - name: Scan the DLLs for paths and environment variables
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env:
          MSYSTEM: UCRT64
          CHERE_INVOKING: "yes"
        run: native/windows/tests/scan-strings.sh

      - name: Check that PKCS#11 support is absent
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}
        env:
          MSYSTEM: UCRT64
          CHERE_INVOKING: "yes"
        run: native/windows/tests/no-pkcs11.sh

      - name: Check the manifest
        working-directory: native/windows/out
        run: |
          python -m json.tool manifest.json
          # Every DLL is listed, and Wintun is not bundled.
          for dll in bin/*.dll; do grep -qF "\"$dll\"" manifest.json; done
          test ! -e bin/wintun.dll
          # The recipe shipped with the source is exactly the files git tracks
          # in this folder of the repository: the same names, the same contents.
          diff <(git -C .. ls-files | sort) <(cd source/recipe && find . -type f | sed 's|^\./||' | sort)
          git -C .. ls-files | while read -r f; do cmp "../$f" "source/recipe/$f"; done
          # Nothing is shippable until the tests below have passed.
          python -c "import json; assert json.load(open('manifest.json'))['shippable'] is False"

      - name: Build the probe (MSVC target)
        working-directory: native/probe
        run: |
          rustup toolchain install
          rustc -vV | grep '^host: x86_64-pc-windows-msvc$'
          cargo build --release --locked

      # The probe runs with a PATH of the build output and Windows itself, so
      # every DLL it loads is one we built or bundled.
      - name: Probe (certificate, login form and logging callbacks)
        working-directory: native/probe
        run: |
          windows=/c/Windows/System32:/c/Windows
          ours=$(cd ../windows/out/bin && pwd)
          openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 2 -subj "//CN=localhost"
          python fake_server.py cert.pem key.pem 4444 &
          ./wait-for-server.sh 4444 $!
          # Control: without the build output there is no libopenconnect to load,
          # so the probe cannot start and never prints a version.
          status=0
          PATH="$windows" ./target/release/oc-probe.exe probe https://127.0.0.1:4444 >control.txt 2>&1 || status=$?
          cat control.txt
          if [ "$status" = 0 ] || grep -q '^version' control.txt; then
            echo "the probe loaded a libopenconnect that is not ours"
            exit 1
          fi
          PATH="$ours:$windows" ./target/release/oc-probe.exe probe https://127.0.0.1:4444 | tee probe.txt
          grep -qE '^version  = v9\.21(-|$)' probe.txt
          grep -qx 'RESULT: PASS' probe.txt

      # Wintun is used for the tests only. It is not part of the build output.
      - name: Connect (login, connection and Wintun tunnel device)
        working-directory: native/probe
        run: |
          windows=/c/Windows/System32:/c/Windows
          ours=$(cd ../windows/out/bin && pwd)
          curl -fsSLo wintun.zip "$WINTUN_URL"
          echo "$WINTUN_SHA256 *wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          cp wintun/bin/amd64/wintun.dll target/release/
          python fake_server.py cert.pem key.pem 4445 &
          ./wait-for-server.sh 4445 $!
          PATH="$ours:$windows" ./target/release/oc-probe.exe connect https://127.0.0.1:4445 testuser testpass | tee connect.txt
          grep -qE '^version  = v9\.21(-|$)' connect.txt
          grep -qx 'RESULT: PASS' connect.txt

      - name: Planted configuration files are ignored
        run: native/windows/tests/planted-files.sh

      # The trace downloads Process Monitor, which cannot be pinned, and runs it
      # as administrator on the machine that holds the output. Record what the
      # output contains first, and upload the record so that it is out of this
      # machine's reach.
      - name: Record the output before the trace
        run: |
          native/windows/tests/seal.sh self-test
          native/windows/tests/seal.sh record "$(cygpath -u "$RUNNER_TEMP")/seal/checksums.txt"
          cat "$(cygpath -u "$RUNNER_TEMP")/seal/checksums.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libopenconnect-windows-x64-checksums
          path: ${{ runner.temp }}/seal/checksums.txt
          if-no-files-found: error

      - name: Trace the files and registry keys the probe touches
        timeout-minutes: 10
        run: native/windows/tests/trace.sh

      # Kept when the job fails, so that a path the trace refuses can be traced
      # to the program that touched it. It holds the events of the probe and
      # the programs it started, without command lines or environments.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: native-windows-trace
          path: native/windows/work/procmon/probe-trace.tsv
          if-no-files-found: ignore

      # Reached only if every step above passed on this output. An output whose
      # GnuTLS was reused is uploaded too, but it is not shippable and its name
      # says so.
      - name: Mark the output shippable
        id: approve
        env:
          EVENT: ${{ github.event_name }}
        run: |
          native/windows/tests/approve.sh
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          m = json.load(open('native/windows/out/manifest.json'))
          built = next(c for c in m['components'] if c['name'] == 'gnutls')['built_in_this_run']
          assert m['shippable'] is built and (m['blockers'] == []) is built
          assert built or os.environ['EVENT'] == 'pull_request', 'only a pull request may reuse a GnuTLS build'
          print('suffix=' + ('' if built else '-reused-gnutls'))
          EOF

      # The last thing before the upload: the output must still be exactly
      # what was recorded before the trace, apart from the manifest being
      # marked as the record expected. The record is fetched back from GitHub
      # rather than read from where this machine kept it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libopenconnect-windows-x64-checksums
          path: ${{ runner.temp }}/sealed

      - name: Check the output is what was recorded before the trace
        run: native/windows/tests/seal.sh verify "$(cygpath -u "$RUNNER_TEMP")/sealed/checksums.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libopenconnect-windows-x64${{ steps.approve.outputs.suffix }}
          path: native/windows/out
          # The recipe has a .gitignore, which would otherwise be left out.
          include-hidden-files: true
          if-no-files-found: error
