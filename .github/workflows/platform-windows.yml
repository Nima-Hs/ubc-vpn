name: Platform (Windows)

# The Windows channel is the boundary between ordinary programs and the
# admin-level service. Some of its rules can only be tested by an elevated
# process with a second user to play the stranger, which a developer machine
# does not have. GitHub's Windows runners run elevated, so those tests run
# here, and this workflow fails if any of them was skipped.

on:
  pull_request:
    paths:
      - crates/platform/**
      - crates/core/**
      - native/windows/wintun.pin
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/platform-windows.yml
  push:
    branches: [main]
    paths:
      - crates/platform/**
      - crates/core/**
      - native/windows/wintun.pin
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/platform-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  channel:
    name: channel (${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    env:
      # Turns every "skipped: needs an elevated process" into a failure.
      UBC_VPN_REQUIRE_ELEVATED: "1"
      TEST_USER: ubc-vpn-stranger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A stalled download would otherwise hold the job until its own limit.
      - name: Install the pinned Rust toolchain
        id: toolchain
        timeout-minutes: 4
        continue-on-error: true
        run: rustup toolchain install
      - name: Install the pinned Rust toolchain, second try
        if: steps.toolchain.outcome != 'success'
        timeout-minutes: 4
        run: rustup toolchain install
      # Restores the build of our dependencies, not of our own crates, which
      # are always built again. After the toolchain: its version is part of
      # the key, as are the OS, the job and the lockfile.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: platform-windows-${{ matrix.profile }}
      - name: Dev-mode code is free of warnings on Windows
        if: matrix.profile == 'debug'
        run: cargo clippy --locked -p ubc-vpn-platform --features dev-mode --all-targets -- -D warnings
      # Without the test-only features there must be no way to send a program
      # a request to stop. The crate's documentation has an example that
      # must not compile without them.
      - name: A build without the test-only features cannot send an interrupt
        if: matrix.profile == 'debug'
        shell: bash
        run: |
          cargo test --locked -p ubc-vpn-platform --doc 2>&1 | tee doc.log
          grep -q "interrupt (line [0-9]*) - compile fail ... ok" doc.log
          # Nor a way to start a program in a terminal made for a test.
          grep -q "terminal (line [0-9]*) - compile fail ... ok" doc.log
      # The routes are tested on a Wintun adapter, the device that ships. The
      # library is the one native/windows/wintun.pin names, checked against
      # its digest, kept outside the checkout, loaded by test code only, and
      # never uploaded: used here, not redistributed.
      - name: Fetch the pinned Wintun library for the tests
        shell: bash
        run: |
          mapfile -t pin < native/windows/wintun.pin
          url='^WINTUN_URL=(https://www\.wintun\.net/builds/[A-Za-z0-9._-]+\.zip)$'
          sha='^WINTUN_SHA256=([0-9a-f]{64})$'
          if [ "${#pin[@]}" -ne 2 ] || ! [[ ${pin[0]} =~ $url ]]; then
            echo "native/windows/wintun.pin is not as expected."
            exit 1
          fi
          zip_url=${BASH_REMATCH[1]}
          if ! [[ ${pin[1]} =~ $sha ]]; then
            echo "native/windows/wintun.pin is not as expected."
            exit 1
          fi
          digest=${BASH_REMATCH[1]}
          cd "$RUNNER_TEMP"
          curl -fsSLo wintun.zip "$zip_url"
          echo "$digest *wintun.zip" | sha256sum -c -
          unzip -q wintun.zip
          echo "UBC_VPN_TEST_WINTUN=$(cygpath -w "$RUNNER_TEMP/wintun/bin/amd64/wintun.dll")" >> "$GITHUB_ENV"
      # The second user exists for this one step. Its random password stays in
      # this step's memory: it is handed to the tests through their
      # environment and never written to a file, a log or a command line.
      - name: Tests, including the elevated ones, with a throwaway second user
        shell: pwsh
        run: |
          $bytes = [byte[]]::new(24)
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = 'Aa1!' + [Convert]::ToBase64String($bytes)
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $env:TEST_USER -Password $secure -AccountNeverExpires | Out-Null
          try {
            Add-LocalGroupMember -Group Users -Member $env:TEST_USER
            $env:UBC_VPN_TEST_USER = $env:TEST_USER
            $env:UBC_VPN_TEST_PASSWORD = $password
            $profile = if ('${{ matrix.profile }}' -eq 'release') { '--release' } else { $null }
            cargo test --locked -p ubc-vpn-platform --features dev-mode $profile -- --nocapture |
              Tee-Object -FilePath test.log
            if ($LASTEXITCODE -ne 0) { throw 'The tests failed.' }
          } finally {
            Remove-LocalUser -Name $env:TEST_USER
          }
      # A test that is skipped passes. So prove from the log that each test
      # needing elevation, a second user, the loopback network or a console
      # of its own really ran.
      - name: The elevated tests really ran
        shell: bash
        run: |
          for test in suite users dev remote console "interrupt" "interrupt unheard" "interrupt sent" "state fresh" "state squat" routes physical crash ipv6 "orphan row" "service manager" "service manager slow start" dns "dns policy" "dns policy empty" "dns foreign" "dns effective" "dns owner" "dns volatile" "dns catch all" "full tunnel" "full tunnel no ipv6" "full tunnel foreign" events "events late" "events since capture" "events ipv6" "program folder" "program file" "program link" "program add" install "install unconfigured" "install while starting"; do
            if ! grep -q "RAN: $test" test.log; then
              echo "The elevated test '$test' did not run."
              exit 1
            fi
          done
          if grep "SKIPPED:" test.log; then
            echo "A test was skipped."
            exit 1
          fi
      # The tests write name resolution rules under identifiers of their own,
      # so that they cannot touch the product's. A build that ships must
      # hold only the product's, or it would write rules no later version
      # knows to remove. The service holds every product identifier, which
      # shows the search can find them. Each program is built on its own, as
      # it ships: built together, they would share each other's features.
      - name: The programs that ship hold none of the tests' DNS rule identifiers
        if: matrix.profile == 'release'
        shell: bash
        run: |
          source=crates/platform/src/windows/dns.rs
          # The identifiers in the constant named $1, from its first line to
          # the line that ends it.
          ids() {
            awk -v name="$1" '$0 ~ "^const " name ": " { on = 1 } on { print } on && /;$/ { exit }' "$source" |
              grep -o '{[0-9A-F-]*}'
          }
          mapfile -t product < <(ids PRODUCT_RULES; ids PRODUCT_CATCH_ALL)
          mapfile -t tests < <(ids TEST_RULES; ids TEST_CATCH_ALL)
          if [ "${#product[@]}" -ne 7 ] || [ "${#tests[@]}" -ne 7 ]; then
            echo "Could not read the rule identifiers from $source."
            exit 1
          fi
          # Holds none of the tests' identifiers.
          check() {
            for id in "${tests[@]}"; do
              if grep -qaF "$id" "$1"; then
                echo "$1 holds the tests' rule $id."
                exit 1
              fi
            done
          }
          cargo build --locked --release -p ubc-vpn-service
          for id in "${product[@]}"; do
            if ! grep -qaF "$id" target/release/ubc-vpn-service.exe; then
              echo "The service does not hold the product's rule $id."
              exit 1
            fi
          done
          check target/release/ubc-vpn-service.exe
          cargo build --locked --release -p ubc-vpn-cli
          check target/release/ubc-vpn.exe
      - name: The second user is gone
        if: always()
        shell: pwsh
        run: |
          if (Get-LocalUser -Name $env:TEST_USER -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $env:TEST_USER
          }
