name: Installer (Linux)

# Builds the Linux .deb and .rpm with the service, the command-line client
# and libopenconnect. Installs the .deb as root on a runner, checks what
# landed where, who can change it and that the service answers a standard
# user, installs it again over itself, removes it, purges it, and checks
# nothing is left. Then installs both packages in containers of the other
# systems they are for, and upgrades the .rpm over itself in a Fedora
# container that systemd runs, with the service running. The rules come from docs/architecture.md, "What the
# installers must do".
#
# Nothing is signed. The packages and the source of their LGPL library are
# kept as artifacts for a few days, for trying by hand; they are not a
# release.

on:
  pull_request:
    paths:
      - app/**
      - packaging/linux/**
      - packaging/windows/policy.json
      - crates/**
      - native/linux/**
      - native/check-patches.sh
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/installer-linux.yml
      # Last, so it wins: a change to Markdown files alone starts nothing.
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - app/**
      - packaging/linux/**
      - packaging/windows/policy.json
      - crates/**
      - native/linux/**
      - native/check-patches.sh
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/installer-linux.yml
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-linux-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The same build as the Native library (Linux) workflow's: native/linux/
  # build.sh in the same pinned image. The two digests below must stay the
  # ones in native-linux.yml. Built here, so the source the packages point
  # to is from the same run as the library in them.
  native:
    name: Build libopenconnect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the three builds apply the same patch
        run: bash native/check-patches.sh
      - name: Build libopenconnect
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_IMAGE: ubuntu@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
        run: bash native/linux/build.sh out
      # A tarball, to keep the library's symbolic links.
      - name: Pack
        run: tar -C out -czf libopenconnect-linux-x64.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libopenconnect-linux-x64
          path: libopenconnect-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  package:
    name: Build the packages
    needs: native
    # The oldest supported system, so the programs need no newer glibc than
    # it has.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      # The packaging tools in native/linux/test-packages.sh, all of them.
      PACKAGING_TOOLS: >-
        binutils binutils-common binutils-x86-64-linux-gnu libbinutils libctf0 libctf-nobfd0
        tar xz-utils liblzma5 liblzma-dev
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libopenconnect-linux-x64
          path: ${{ runner.temp }}/download
      - name: Unpack the library
        run: |
          mkdir "$RUNNER_TEMP/native"
          tar -xzf "$RUNNER_TEMP/download/libopenconnect-linux-x64.tar.gz" -C "$RUNNER_TEMP/native"

      # The client's keyring links the system's libdbus-1: its headers and
      # pkg-config. rpm's rpmbuild builds the .rpm. fpm writes the .deb with
      # the ar, tar and xz it finds on PATH: binutils, tar and xz-utils,
      # with the libraries of theirs that do the work. All at the versions
      # pinned in test-packages.sh, from its dated Ubuntu snapshot; the
      # runner's newer copies of the tools, if it has any, are downgraded
      # to their pins, and the script stops on any version that differs.
      # This job keeps its own cache of them, saved below; the script checks
      # every package again regardless.
      - name: Restore the pinned packages
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/ubc-vpn-test-packages
          key: test-packages-ubuntu-22.04-${{ hashFiles('native/linux/test-packages.sh') }}-pkg-config-libdbus-1-dev-rpm-packaging-tools
      - name: Install the pinned D-Bus headers, rpm and packaging tools
        working-directory: .
        env:
          TEST_PACKAGES_CACHE: /var/tmp/ubc-vpn-test-packages
        run: |
          mkdir "$RUNNER_TEMP/packages" "$RUNNER_TEMP/tools"
          bash native/linux/test-packages.sh "$RUNNER_TEMP/packages" pkg-config libdbus-1-dev rpm
          bash native/linux/test-packages.sh "$RUNNER_TEMP/tools" $PACKAGING_TOOLS
          rpmbuild --version
      - name: Save the pinned packages
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/ubc-vpn-test-packages
          key: ${{ steps.packages.outputs.cache-primary-key }}

      # A stalled download would otherwise hold the job until its own limit.
      - name: Install the pinned Rust toolchain
        id: toolchain
        working-directory: .
        timeout-minutes: 4
        continue-on-error: true
        run: rustup toolchain install
      - name: Install the pinned Rust toolchain, second try
        if: steps.toolchain.outcome != 'success'
        working-directory: .
        timeout-minutes: 4
        run: rustup toolchain install

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Stage the programs and the library
        working-directory: .
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          version=$(node -p "require('./app/package.json').version")
          packaging/linux/stage.sh "$RUNNER_TEMP/native" \
            "run $GITHUB_RUN_ID of the Installer (Linux) workflow, from commit $GITHUB_SHA: $RUN_URL" \
            "$RUNNER_TEMP/sources/ubc-vpn-$version-linux-x64-sources.tar.gz"

      # electron-builder downloads fpm itself, checked against a checksum
      # this version of it carries. fpm must find the pinned tools, with
      # the PATH pnpm gives it.
      - name: fpm finds the pinned ar, tar and xz
        run: pnpm exec bash ../packaging/linux/check-tools.sh $PACKAGING_TOOLS
      - name: Build the .deb and the .rpm
        run: pnpm package:linux
      - name: The app is fused and licensed, the packages are as they should be, and there is no updater
        run: pnpm check:package:linux

      - name: Note the packages' SHA-256
        run: |
          cd dist
          sha256sum ubc-vpn_*_amd64.deb | tee ubc-vpn.deb.sha256
          sha256sum ubc-vpn-*.x86_64.rpm | tee ubc-vpn.rpm.sha256
          dpkg-deb --info ubc-vpn_*_amd64.deb
          rpm --query --info --package ubc-vpn-*.x86_64.rpm
          for sum in ubc-vpn.deb.sha256 ubc-vpn.rpm.sha256; do
            read -r hash file < "$sum"
            printf '### %s\n\nSHA-256: `%s`\n\n' "$file" "$hash" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Keep the .deb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubc-vpn-linux-x64-deb-unsigned
          path: |
            app/dist/ubc-vpn_*_amd64.deb
            app/dist/ubc-vpn.deb.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Keep the .rpm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubc-vpn-linux-x64-rpm-unsigned
          path: |
            app/dist/ubc-vpn-*.x86_64.rpm
            app/dist/ubc-vpn.rpm.sha256
          if-no-files-found: error
          retention-days: 7
      # For the jobs below only.
      - name: Pass the stage on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-stage-linux
          path: app/stage
          if-no-files-found: error
          retention-days: 1
      - name: Keep the source of the LGPL library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubc-vpn-linux-x64-sources
          path: ${{ runner.temp }}/sources/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Installs, updates, removes and purges the .deb as root, on GitHub's
  # runner, which systemd runs and which is thrown away after the job. The
  # job uses no secrets.
  install:
    name: Install the .deb
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECK: packaging/linux/tests/installer.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install the app's packages, for its package check
        working-directory: app
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ubc-vpn-linux-x64-deb-unsigned
          path: ${{ runner.temp }}/deb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-stage-linux
          path: ${{ runner.temp }}/stage
      - name: Find the .deb
        run: |
          cd "$RUNNER_TEMP/deb"
          sha256sum --check ubc-vpn.deb.sha256
          echo "DEB=$RUNNER_TEMP/deb/$(ls ubc-vpn_*_amd64.deb)" >> "$GITHUB_ENV"

      - name: Install
        run: |
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" prepare
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" install "$DEB"
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" remember-files "$RUNNER_TEMP/files.txt"
      - name: Every file is installed as packaged and staged
        run: |
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" installed "$DEB"
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" as-staged "$RUNNER_TEMP/stage"
      - name: Only root can change the installed app
        run: sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" who-can-change
      - name: No rpath or runpath
        run: sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" no-rpath
      - name: The installed app is fused, licensed and has no updater
        working-directory: app
        run: node scripts/check-package.mjs linux "/opt/UBC VPN"
      - name: The service is installed, running and answers a standard user
        run: |
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" service
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" status-as-user
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" remember-state "$RUNNER_TEMP/state.sha256"

      # Saving a password. The installed client, started by the app's own code
      # with the environment the app gives it, in a session with a real Secret
      # Service. gnome-keyring is a test tool, pinned in test-packages.sh, and
      # never shipped; the script checks every package again on a cache hit.
      - name: Installed programs have no use for the runtime folder
        run: sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" no-runtime-dir
      - name: Restore the pinned keyring
        id: keyring-packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/ubc-vpn-test-packages
          key: test-packages-noble-${{ hashFiles('native/linux/test-packages.sh') }}-gnome-keyring
      - name: Install the pinned keyring
        env:
          TEST_PACKAGES_CACHE: /var/tmp/ubc-vpn-test-packages
        run: |
          mkdir "$RUNNER_TEMP/keyring-packages"
          bash native/linux/test-packages.sh "$RUNNER_TEMP/keyring-packages" gnome-keyring
      - name: Save the pinned keyring
        if: steps.keyring-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/ubc-vpn-test-packages
          key: ${{ steps.keyring-packages.outputs.cache-primary-key }}
      - name: The installed client reaches the keyring, as the app starts it
        working-directory: app
        env:
          UBC_VPN_TEST_THROWAWAY_MACHINE: "1"
        run: bash ../packaging/linux/tests/keyring-session.sh

      # Installing over an existing install is how an update arrives: the
      # old version's scripts keep the service and its data, and the new
      # one's brings the unit up to date and starts it again; the owner in
      # state.json survives.
      - name: Install again over it
        run: |
          sudo dpkg -i "$DEB"
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" no-conffiles
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" installed "$DEB"
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" links
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" who-can-change
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" service
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" state-kept "$RUNNER_TEMP/state.sha256"
      - name: The scripts are safe to run twice
        run: |
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" scripts-twice
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" state-kept "$RUNNER_TEMP/state.sha256"
      - name: Remove
        run: |
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" remove
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" removed "$RUNNER_TEMP/files.txt"
      - name: Purge
        run: |
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" purge
          sudo UBC_VPN_TEST_THROWAWAY_MACHINE=1 bash "$CHECK" purged "$RUNNER_TEMP/files.txt"

      - name: What the service logged
        if: failure()
        run: sudo journalctl -u ubc-vpn.service -o cat --no-pager | tail -n 200 || true

  # The packages in containers of the other systems they are for, where
  # systemd does not run. Each system's own package manager resolves what
  # the package depends on from that system's archive, so the names must be
  # right there; the files must land as packaged and staged; the scripts
  # must leave out the service and say so; and removing the package must
  # leave nothing. Ubuntu 24.04 is the job above. The images are pinned by
  # digest, as in native-linux.yml; GitHub runs each container as root on a
  # runner it throws away.
  containers:
    name: Install in ${{ matrix.name }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu 22.04
            image: ubuntu@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
            kind: deb
          - name: debian 12
            image: debian@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858
            kind: deb
          - name: fedora
            image: fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            kind: rpm
    env:
      CHECK: packaging/linux/tests/installer.sh
      KIND: ${{ matrix.kind }}
      UBC_VPN_TEST_THROWAWAY_MACHINE: "1"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ubc-vpn-linux-x64-${{ matrix.kind }}-unsigned
          path: ${{ runner.temp }}/package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-stage-linux
          path: ${{ runner.temp }}/stage
      # What the checks need besides the base image: rpm2cpio comes with
      # rpm, and cpio, cmp and find are added on Fedora.
      - name: Install
        run: |
          cd "$RUNNER_TEMP/package"
          sha256sum --check "ubc-vpn.$KIND.sha256"
          package="$RUNNER_TEMP/package/$(ls ubc-vpn*."$KIND")"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
          if [ "$KIND" = deb ]; then
            apt-get update -qq
            apt-get install -y --no-install-recommends "$package" 2>&1 | tee "$RUNNER_TEMP/install.log"
          else
            dnf install -y cpio diffutils findutils
            dnf install -y "$package" 2>&1 | tee "$RUNNER_TEMP/install.log"
          fi
      - name: Without systemd, the service is left out and the files land
        run: |
          bash "$CHECK" service-skipped "$RUNNER_TEMP/install.log"
          bash "$CHECK" installed "$PACKAGE"
          bash "$CHECK" links
          bash "$CHECK" as-staged "$RUNNER_TEMP/stage"
      # rpm -U runs the new version's %post with 2, then the old one's
      # %preun and %postun with 1, as an update does. The fedora-systemd job
      # below does the same with the service running.
      - name: An upgrade over itself keeps the links and the files
        if: matrix.kind == 'rpm'
        run: |
          rpm -Uvh --replacepkgs "$PACKAGE"
          bash "$CHECK" links
          bash "$CHECK" installed "$PACKAGE"
          bash "$CHECK" as-staged "$RUNNER_TEMP/stage"
      - name: Removing it leaves nothing
        run: |
          if [ "$KIND" = deb ]; then
            apt-get purge -y ubc-vpn
          else
            dnf remove -y ubc-vpn
          fi
          bash "$CHECK" gone

  # The .rpm on Fedora with systemd running, in a container started on the
  # runner with systemd as its first process: installed, its service
  # started and owned by a standard user, then upgraded over itself with
  # rpm -U, which runs the new version's %post with 2 and the old one's
  # %preun and %postun with 1, as an update does; then removed. The image
  # is the containers job's, pinned by digest; systemd and the tools the
  # checks need come from Fedora's live archive, and nothing from it ships.
  # The runner is GitHub's, thrown away after the job, which uses no
  # secrets.
  fedora-systemd:
    name: Upgrade the .rpm in fedora with systemd
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Docker Hub's, as GitHub pulls for the containers job; podman would
      # look a short name up elsewhere.
      IMAGE: docker.io/library/fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
      CHECK: packaging/linux/tests/installer.sh
      # Runs a command as root in the container, in the checkout.
      IN_FEDORA: sudo podman exec --env UBC_VPN_TEST_THROWAWAY_MACHINE=1 --workdir /src fedora
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ubc-vpn-linux-x64-rpm-unsigned
          path: ${{ runner.temp }}/package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-stage-linux
          path: ${{ runner.temp }}/stage
      - name: Start Fedora with systemd
        run: |
          (cd "$RUNNER_TEMP/package" && sha256sum --check ubc-vpn.rpm.sha256)
          echo "PACKAGE=/work/package/$(cd "$RUNNER_TEMP/package" && ls ubc-vpn-*.x86_64.rpm)" >> "$GITHUB_ENV"
          sudo podman run --name base "$IMAGE" \
            dnf install -y systemd sudo acl shadow-utils procps-ng cpio diffutils findutils
          sudo podman commit base fedora-systemd
          sudo podman run --detach --name fedora --systemd=always --privileged \
            --volume "$GITHUB_WORKSPACE:/src:ro" --volume "$RUNNER_TEMP:/work:ro" \
            fedora-systemd /usr/sbin/init
          state=
          for _ in $(seq 90); do
            state=$(sudo podman exec fedora systemctl is-system-running 2> /dev/null || true)
            case "$state" in running | degraded) break ;; esac
            sleep 1
          done
          echo "systemd is $state"
          case "$state" in running | degraded) ;; *) exit 1 ;; esac
      - name: Install, with the service running and owned by a standard user
        run: |
          $IN_FEDORA bash "$CHECK" prepare
          $IN_FEDORA dnf install -y "$PACKAGE"
          $IN_FEDORA bash "$CHECK" installed "$PACKAGE"
          $IN_FEDORA bash "$CHECK" links
          $IN_FEDORA bash "$CHECK" service
          $IN_FEDORA bash "$CHECK" status-as-user
          $IN_FEDORA bash "$CHECK" remember-state /root/state.sha256
      - name: Upgrade it over itself
        run: |
          $IN_FEDORA rpm -Uvh --replacepkgs "$PACKAGE"
          $IN_FEDORA bash "$CHECK" links
          $IN_FEDORA bash "$CHECK" installed "$PACKAGE"
          $IN_FEDORA bash "$CHECK" as-staged /work/stage
          $IN_FEDORA bash "$CHECK" who-can-change
          $IN_FEDORA bash "$CHECK" service
          $IN_FEDORA bash "$CHECK" state-kept /root/state.sha256
          $IN_FEDORA bash "$CHECK" status-as-user
      - name: Remove
        run: |
          $IN_FEDORA rpm -e ubc-vpn
          $IN_FEDORA bash "$CHECK" gone
      - name: What the service logged
        if: failure()
        run: sudo podman exec fedora journalctl -u ubc-vpn.service -o cat --no-pager | tail -n 200 || true
