[package]
name = "ubc-vpn-platform"
description = "The OS seam for UBC VPN: routes, DNS, network events, the channel transport and paths"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The in-memory fake and the shared behaviour suite. Enable it from another
# crate's dev-dependencies and from the service's dev-mode feature only: a
# release build must not contain it. This crate's own tests always have it.
fake = ["rustix/pty"]
# Dev mode: adds `Mode::Dev` and brings the fake with it, so the service's own
# dev-mode feature enables this one feature and nothing else. Never enabled in
# a release build.
dev-mode = ["fake"]
# Saved passwords in the user's OS keyring (`secrets`). Only the
# command-line client enables it: the service must never link the keyring,
# and CI checks that it does not.
secrets = ["dep:keyring"]

[dependencies]
ubc-vpn-core.workspace = true

# This crate calls OS APIs, so it cannot inherit the workspace ban on unsafe
# code. Every unsafe block must carry a SAFETY comment.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[target."cfg(windows)".dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"], optional = true }
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Console", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_SystemInformation", "Win32_System_Services", "Win32_System_Registry", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61", default-features = false, features = ["Win32_System_LibraryLoader", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Dns"] }

[target."cfg(unix)".dependencies]
libc = { version = "0.2.190", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["std", "net", "event", "process", "fs", "termios"] }

[target."cfg(unix)".dev-dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["pty"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["async-secret-service", "crypto-rust", "async-io"], optional = true }
