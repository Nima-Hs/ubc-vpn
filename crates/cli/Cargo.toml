[package]
name = "ubc-vpn-cli"
description = "The command-line client for UBC VPN"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ubc-vpn"
path = "src/main.rs"

[features]
# Dev mode: the `--dev` flag, which points every command at the dev-mode
# service's channel and files and logs in against a scripted pretend gateway.
# Never enabled in a release build; without it the flag does not exist.
dev-mode = ["ubc-vpn-platform/dev-mode", "ubc-vpn-engine/fake"]
# The real VPN engine: `libopenconnect`, loaded at run time from the folder
# the program was installed in. Building with it needs UBC_VPN_NATIVE_DIR to
# name our own pinned build of the library (see CONTRIBUTING.md). Without
# it, the program cannot connect.
real-engine = ["ubc-vpn-engine/libopenconnect"]

[dependencies]
serde_json = "1.0.154"
ubc-vpn-core.workspace = true
ubc-vpn-engine.workspace = true
ubc-vpn-platform = { workspace = true, features = ["secrets"] }

[lints]
workspace = true

[dev-dependencies]
ubc-vpn-engine = { workspace = true, features = ["fake"] }
ubc-vpn-platform = { workspace = true, features = ["fake"] }
ubc-vpn-service = { path = "../service" }
