[package]
name = "ubc-vpn-service"
description = "The privileged background service for UBC VPN"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Dev mode: the `--dev` flag, which runs the service unprivileged with fake
# routing, fake DNS and the fake engine. Never enabled in a release build;
# without it the flag does not exist.
dev-mode = ["ubc-vpn-platform/dev-mode", "ubc-vpn-engine/fake"]

[dependencies]
serde_json = "1.0.154"
ubc-vpn-core.workspace = true
ubc-vpn-engine.workspace = true
ubc-vpn-platform.workspace = true

[lints]
workspace = true

[dev-dependencies]
ubc-vpn-engine = { workspace = true, features = ["fake"] }
ubc-vpn-platform = { workspace = true, features = ["fake"] }
