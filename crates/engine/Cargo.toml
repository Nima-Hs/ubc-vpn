[package]
name = "ubc-vpn-engine"
description = "The VPN engine interface for UBC VPN, with a fake for tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The real engine, a binding to libopenconnect, will live behind this feature.
# It is off by default and enables nothing yet, so ordinary builds and tests
# need no native library.
libopenconnect = []
# The scripted engine in `fake`, for other crates' tests (as a
# dev-dependency feature) and for the service's dev-mode feature. A release
# build of the service must never enable it. This crate's own tests always
# have the fake.
fake = []
# Lets debug-level log lines through `LogSink`, and only in builds that also
# have debug assertions. For development only: the library's debug output
# holds the session cookie, so a release build must never enable it.
debug-logs = []

[dependencies]
ubc-vpn-core.workspace = true

# This crate calls a C library, so it cannot inherit the workspace ban on
# unsafe code. Every unsafe block must carry a SAFETY comment.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
