# cargo-deny: licence, advisory and source checks for Rust dependencies.
# See .claude/rules/dependencies.md.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive licences only. Anything else needs explicit approval first.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
